# Operations in api/openapi.yaml that have no `mailgoose` CLI command on
# purpose. Every other operation must have one (CLI-1); the parity check in
# internal/cli/parity_test.go fails, naming the operation, when it doesn't.
#
# Each entry is `operationId: reason`. Expected later: the
# Stripe webhook, public form submit, unsubscribe, open and click tracking.
# An entry for an operation that has a command, or that isn't in the spec,
# fails the check too, so the list stays short and true.
getReadiness: Load balancer and deploy probe. `mailgoose status` checks liveness through getHealth.
createSession: Web session sign-in; it sets a browser cookie. The CLI signs in with `mailgoose login` (MG-10).
createSignIn: Emails a code for a web session. The CLI signs in with `mailgoose login` (MG-10).
getCurrentSession: Reads the browser's session cookie. The CLI's own sign-in state comes with `mailgoose login` (MG-10).
deleteCurrentSession: Ends the browser's session cookie. The CLI signs out with `mailgoose logout` (MG-10).
deleteAllSessions: Ends every browser session, from the web app's account page. CLI tokens are revoked with the CLI's own commands (MG-10).
getDeviceLogin: The browser approval page (MG-41) reads the pending sign-in with the person's web session; the CLI side is `mailgoose login`.
approveDeviceLogin: Approving a CLI sign-in is the person's click on the browser approval page (MG-41), with their web session; the CLI side is `mailgoose login`.
denyDeviceLogin: Denying a CLI sign-in is the person's click on the browser approval page (MG-41); the CLI side is `mailgoose login`.
