          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpBundle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMailchimpBundle
      summary: Delete an unconfirmed Mailchimp export
      description: |
        Deletes an upload that hasn't been confirmed, with its file, freeing
        one of the account's 3 unconfirmed uploads. A confirmed upload stays
        with its import.
