  /v1/emails/{email_id}/blocks/{block_id}/move:
    post:
      operationId: moveEmailBlock
      summary: Move a block
      description: |
        Moves one block, and a columns block's contents with it, to a new
        place, given as in addEmailBlock. `index` is the place the block
        ends up at. The footer can't move, and nothing can go after it.
        `version` works as in updateEmail.
      tags: [emails]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/EmailId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveEmailBlockRequest"
      responses:
        "200":
          description: The block as saved, and the email with its new version.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBlockChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/BlockNotFound"
        "409":
          $ref: "#/components/responses/EmailVersionConflict"
        "422":
          $ref: "#/components/responses/InvalidBlockChange"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/images:
    get:
      operationId: listImages
      summary: List uploaded images
      description: The account's uploaded images, newest first.
      tags: [images]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of images.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: uploadImage
      summary: Upload an image
      description: |
        Stores a picture for image blocks and answers with its `url`, which
        goes in an image block's `src`. JPEG, PNG, GIF and WebP up to 5 MB
        are accepted, checked by what the file holds, not its name, and an
        account keeps up to 1,000. The file
        is sent base64-encoded in `data`, so the request body can be up to
        7 MB. `mailgoose image upload ./pic.png` does the encoding.
      tags: [images]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadImageRequest"
      responses:
        "201":
          description: The stored image.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidImage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/accounts:
    get:
      operationId: findAdminAccounts
      summary: Find accounts (admin)
      description: |
        mailgoose staff only (OPS-6): accounts whose id is `q`, or whose
        owner's address, name or sending domain contains it. At most `limit`
        of them, newest first; there's no next page. Admin endpoints need a
        signed-in admin (a CLI token or web session, not an API key) and
        answer 403 `admin_only` to anyone else.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: |
            An account id, or part of an address, name or domain. Required;
            the endpoint answers 400 `invalid_parameter` without it (it's
            checked after the caller is, so others get 401 or 403 first).
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The accounts found.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/accounts/{account_id}:
    get:
      operationId: getAdminAccount
      summary: Look at an account (admin)
      description: |
        mailgoose staff only: an account's owner, pause, send limit, credits,
        last 30 days' bounces and complaints, held imports and live
        campaigns.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/accounts/{account_id}/pause:
    post:
      operationId: pauseAccount
      summary: Pause an account's sending (admin)
      description: |
        mailgoose staff only, the kill switch for an account (CMP-8): nothing
        more is sent from it, from the next copy on. Its campaigns stay as
        they are and carry on when it's unpaused. `reason` is logged and
        shown to the account as why. Pausing a paused account replaces the
        reason.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidAdminRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/accounts/{account_id}/unpause:
    post:
      operationId: unpauseAccount
      summary: Let an account send again (admin)
      description: |
        mailgoose staff only: lifts a pause, an admin's or an automatic one.
        The account's sending campaigns carry on where they stopped.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidAdminRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/accounts/{account_id}/credits:
    post:
      operationId: grantCredits
      summary: Grant credits (admin)
      description: |
        mailgoose staff only: gives the account credits, which last 24
        months like bought ones. They show in its history as a `grant`.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreditsRequest"
      responses:
        "200":
          description: Granted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidAdminRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/campaigns/{campaign_id}/stop:
    post:
      operationId: stopCampaign
      summary: Stop a campaign in flight (admin)
      description: |
        mailgoose staff only, the kill switch for a campaign (CMP-8): a
        scheduled, sending or paused campaign is cancelled where it stands.
        Nobody else gets it, from the next copy on, and the credits for who's
        left come back. Stopping a cancelled campaign changes nothing; one
        that's a draft or finished answers 409 `campaign_locked`.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonRequest"
      responses:
        "200":
          description: Stopped, now or before.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CampaignConflict"
        "422":
          $ref: "#/components/responses/InvalidAdminRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/imports/{import_id}/approve:
    post:
      operationId: approveImport
      summary: Approve a held import (admin)
      description: |
        mailgoose staff only (CON-6): a held import's contacts can be mailed.
        An import that isn't held answers 409 `import_not_held`.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonRequest"
      responses:
        "200":
          description: Approved.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`import_not_held`: the import isn't waiting for approval."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidAdminRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/actions:
    get:
      operationId: listAdminActions
      summary: The admin log (admin)
      description: |
        mailgoose staff only: every admin action and automatic pause, newest
        first, with who did it and why; for one account with `account_id`.
      tags: [admin]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: account_id
          in: query
          required: false
          description: Only this account's actions.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the log.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An account API key (`mg_live_…`, `mg_test_…`) or CLI token (`mg_cli_…`), sent as `Authorization: Bearer <key>`."
    sessionCookie:
      type: apiKey
      in: cookie
      name: mg_session
      description: The web session cookie that `createSession` sets.
  schemas:
    ContactStatus:
      type: string
      enum: [unconfirmed, subscribed, unsubscribed, bounced, complained]
      description: |
        Only `subscribed` contacts receive campaigns. `unconfirmed` is waiting
        for double opt-in or permission; `bounced` and `complained` come from
        Amazon SES.
    ContactSource:
      type: string
      enum: [form, import, api, manual]
      description: How the contact was added. `manual` is the web app.
    Contact:
      type: object
      required: [id, email, first_name, last_name, status, source, tags, created_at, updated_at, status_changed_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Stored in lower case.
          examples: [pat@example.com]
        first_name:
          type: [string, "null"]
        last_name:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ContactStatus"
        source:
          $ref: "#/components/schemas/ContactSource"
        tags:
          type: array
          description: The contact's tags, by name.
          items:
            $ref: "#/components/schemas/TagRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
    ContactList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: [string, "null"]
    CreateContactRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          examples: [pat@example.com]
        first_name:
          type: [string, "null"]
          maxLength: 100
        last_name:
          type: [string, "null"]
          maxLength: 100
        status:
          type: string
          enum: [subscribed, unconfirmed, unsubscribed]
          default: subscribed
          description: Use `unconfirmed` for someone who hasn't yet given permission to be mailed.
        source:
          type: string
          enum: [api, manual]
          default: api
          description: '`manual` is for contacts a person typed in; agents and scripts leave it out.'
    UpdateContactRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          maxLength: 254
        first_name:
          type: [string, "null"]
          maxLength: 100
        last_name:
          type: [string, "null"]
          maxLength: 100
        status:
          type: string
          enum: [subscribed, unconfirmed, unsubscribed]
    ContactData:
      type: object
      required: [contact, tags, import, skipped_rows, consents]
      properties:
        contact:
          $ref: "#/components/schemas/Contact"
        tags:
          type: array
          items:
            type: object
            required: [id, name, added_at]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              added_at:
                type: string
                format: date-time
        import:
          description: The import that added the contact; null when none did.
          oneOf:
            - type: "null"
            - type: object
              required: [id, file_name, created_at, permission_confirmed, held]
              properties:
                id:
                  type: string
                  format: uuid
                file_name:
                  type: [string, "null"]
                created_at:
                  type: string
                  format: date-time
                permission_confirmed:
                  type: boolean
                  description: Whether the account confirmed it had permission to mail the people in the file.
                held:
                  type: boolean
                  description: The contact waits for the import's review before it can be mailed.
        skipped_rows:
          type: array
          description: Rows of the account's imports with this address that weren't added.
          items:
            type: object
            required: [import_id, file_name, row, reason]
            properties:
              import_id:
                type: string
                format: uuid
              file_name:
                type: [string, "null"]
              row:
                type: integer
              reason:
                $ref: "#/components/schemas/SkipReason"
        consents:
          type: array
          description: The contact's signups through signup forms, oldest first.
          items:
            type: object
            required: [id, form_id, source, ip, wording, created_at, confirmed_at]
            properties:
              id:
                type: string
                format: uuid
              form_id:
                type: [string, "null"]
                description: Null once the form is deleted; `wording` still says what it showed.
              source:
                type: string
                enum: [form]
              ip:
                type: string
                description: The address the signup was posted from.
              wording:
                type: object
                additionalProperties: true
                description: >-
                  What the form showed: `form_name`, `fields` (their labels),
                  `button_text`, `double_opt_in`, and with double opt-in
                  `confirm_subject` and `confirm_text`.
              created_at:
                type: string
                format: date-time
              confirmed_at:
                type: [string, "null"]
                format: date-time
                description: When the person used the confirm link; null until then.
    TagRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Tag:
      type: object
      required: [id, name, contact_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [newsletter]
        contact_count:
          type: integer
          description: How many contacts have the tag, whatever their status.
        created_at:
          type: string
          format: date-time
    TagList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        next_cursor:
          type: [string, "null"]
    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique in the account, ignoring case; one line, no commas.
    RenameTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    TagDeleted:
      type: object
      required: [contacts_untagged, campaigns_updated]
      properties:
        contacts_untagged:
          type: integer
          description: How many contacts had the tag.
        campaigns_updated:
          type: integer
          description: How many draft or scheduled campaigns had the tag among their recipients.
    ContactFilter:
      type: object
      additionalProperties: false
      description: Matches contacts as `listContacts` does; fields left out don't filter.
      properties:
        email:
          type: string
          maxLength: 254
        name:
          type: string
          maxLength: 201
        status:
          $ref: "#/components/schemas/ContactStatus"
        tag_id:
          type: string
          format: uuid
    ContactSelection:
      type: object
      additionalProperties: false
      description: Exactly one of `contact_ids` and `filter`.
      properties:
        contact_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
        filter:
          $ref: "#/components/schemas/ContactFilter"
    TagChange:
      type: object
      required: [matched, changed]
      properties:
        matched:
          type: integer
          description: How many of the account's contacts were selected.
        changed:
          type: integer
          description: How many gained or lost the tag; the others already had it or didn't.
    ImportColumns:
      type: object
      additionalProperties: false
      description: The header of the column each field comes from. Leave a field out to have it found from common headers.
      properties:
        email:
          type: string
          maxLength: 200
          examples: [Email Address]
        first_name:
          type: string
          maxLength: 200
        last_name:
          type: string
          maxLength: 200
        status:
          type: string
          maxLength: 200
          description: |
            A status column can only hold contacts back: `unsubscribed`,
            `bounced` and `complained` rows are added with that status, and
            `unconfirmed` rows stay unconfirmed. Other values are ignored.
            Found under the header `status`.
        tags:
          type: string
          maxLength: 200
          description: |
            A column of tag names separated by commas, put on each row's
            contact. Tags the account doesn't have are created; a file may
            name at most 200 different tags. Found under the header `tags`.
    CreateImportRequest:
      type: object
      required: [csv]
      additionalProperties: false
      properties:
        csv:
          type: string
          description: The whole CSV file as UTF-8 text, header row first.
          examples: ["email,first_name\npat@example.com,Pat\n"]
        file_name:
          type: [string, "null"]
          maxLength: 255
          description: The file's name, to tell imports apart later.
        columns:
          $ref: "#/components/schemas/ImportColumns"
        tags:
          type: array
          maxItems: 20
          description: Tags, by name or id, put on every contact the import adds. They must exist.
          items:
            type: string
        permission_confirmed:
          type: boolean
          default: false
          description: |
            True says the account has these people's permission to mail them,
            so they're added `subscribed`. Otherwise they're `unconfirmed` and
            don't receive campaigns.
    ImportStatus:
      type: string
      enum: [queued, running, done, failed]
    SkipReason:
      type: string
      enum: [invalid_email, invalid_row, duplicate, exists, suppressed, over_limit]
      description: |
        `invalid_email`: not an email address. `invalid_row`: the row
        couldn't be read as CSV (a stray quote, say). `duplicate`: the same
        address is on an earlier row. `exists`: the account already has the
        contact, which is left as it is. `suppressed`: the address
        unsubscribed, bounced or complained before. `over_limit`: a free
        account was full.
    Import:
      type: object
      required: [id, file_name, status, contact_status, columns, tags, total_rows, processed_rows, imported, skipped,
        skipped_by_reason, review, hold_reason, error, created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ImportStatus"
        contact_status:
          type: string
          enum: [subscribed, unconfirmed]
          description: The status added contacts get; `subscribed` only when permission was confirmed.
        columns:
          type: object
          required: [email, first_name, last_name, status, tags]
          description: The header of the column each field came from; null when the file has none.
          properties:
            email:
              type: string
            first_name:
              type: [string, "null"]
            last_name:
              type: [string, "null"]
            status:
              type: [string, "null"]
            tags:
              type: [string, "null"]
        tags:
          type: array
          description: Tags put on the added contacts. A tag deleted since is left out.
          items:
            $ref: "#/components/schemas/TagRef"
        total_rows:
          type: integer
          description: Contact rows in the file, not counting the header and blank rows.
        processed_rows:
          type: integer
        imported:
          type: integer
          description: Contacts added.
        skipped:
          type: integer
        skipped_by_reason:
          type: object
          required: [invalid_email, invalid_row, duplicate, exists, suppressed, over_limit]
          properties:
            invalid_email:
              type: integer
            invalid_row:
              type: integer
            duplicate:
              type: integer
            exists:
              type: integer
            suppressed:
              type: integer
            over_limit:
              type: integer
        review:
          type: string
          enum: [none, held, approved]
          description: A `held` import's contacts aren't mailed until mailgoose approves it.
        hold_reason:
          type: [string, "null"]
          description: |
            Why a held import is held: `large_first_import` or
            `over_contact_limit`.
        error:
          type: [string, "null"]
          description: Why a `failed` import stopped.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    ImportList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Import"
        next_cursor:
          type: [string, "null"]
    SkippedRow:
      type: object
      required: [row, email, reason]
      properties:
        row:
          type: integer
          description: The row's line in the file, where the header is 1.
        email:
          type: string
          description: The email cell as written; empty when the row couldn't be read.
        reason:
          $ref: "#/components/schemas/SkipReason"
    SkippedRowList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SkippedRow"
        next_cursor:
          type: [string, "null"]
    CreateDomainRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 253
          description: The domain to send from, such as `example.com` or `news.example.com`. Internationalized names are stored in their ASCII (punycode) form.
          examples: [example.com]
    DomainStatus:
      type: string
      enum: [pending, verified, failed]
      description: |
        `pending` until every required record is found and Amazon SES has
        verified the domain; `verified` after that; `failed` when 72 hours of
        checks passed without it.
    DnsRecord:
      type: object
      required: [purpose, type, name, value, priority, required, status, found, detail]
      properties:
        purpose:
          type: string
          enum: [dkim, mail_from_mx, mail_from_spf, dmarc]
        type:
          type: string
          enum: [CNAME, MX, TXT]
        name:
          type: string
          description: The full record name, such as `abc._domainkey.example.com`.
        value:
          type: string
        priority:
          type: [integer, "null"]
          description: The MX priority; null for other types.
        required:
          type: boolean
          description: Whether the domain needs this record to verify. The DMARC record is only suggested.
        status:
          type: string
          enum: [found, missing, wrong, unchecked]
          description: What the last check found; `unchecked` before the first check.
        found:
          type: array
          items:
            type: string
          description: The values the lookup returned, when there were any.
        detail:
          type: [string, "null"]
          description: What is wrong, or why the lookup failed.
    Domain:
      type: object
      required: [id, name, status, mail_from_domain, records, ses_status, created_at, last_checked_at, check_until, verified_at, failed_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [example.com]
        status:
          $ref: "#/components/schemas/DomainStatus"
        mail_from_domain:
          type: string
          description: The MAIL FROM subdomain, where bounces go.
          examples: [bounce.example.com]
        records:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        ses_status:
          type: [string, "null"]
          description: |
            Amazon SES's DKIM verification status at the last check: `pending`,
            `success`, `failed`, `temporary_failure`, `not_started`, or
            `not_found` and `unknown` when SES couldn't say. Null before the
            first check.
        created_at:
          type: string
          format: date-time
        last_checked_at:
          type: [string, "null"]
          format: date-time
        check_until:
          type: string
          format: date-time
          description: When background checks of a pending domain stop.
        verified_at:
          type: [string, "null"]
          format: date-time
        failed_at:
          type: [string, "null"]
          format: date-time
        records_changed:
          type: boolean
          description: Only in `verifyDomain` responses. True when the domain was set up again with new DKIM records, which replace the old ones in DNS.
    DomainList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        next_cursor:
          type: [string, "null"]
    CreateApiKeyRequest:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Claude on my laptop]
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
    AccountSettings:
      type: object
      required: [id, name, plan, from_name, from_email, postal_address, time_zone, missing_for_send, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
          enum: [free, paid]
        from_name:
          type: [string, "null"]
          description: The default From name for new campaigns.
          examples: [Pat's Bakery]
        from_email:
          type: [string, "null"]
          description: The default From address for new campaigns.
          examples: [news@patsbakery.example]
        postal_address:
          type: [string, "null"]
          description: The mailing address in every email's footer, one line per `\n`.
          examples: ["Pat's Bakery\n12 Main St\nSpringfield, IL 62701"]
        time_zone:
          type: string
          description: An IANA time zone name.
          examples: [America/Chicago]
        missing_for_send:
          type: array
          items:
            type: string
          description: Settings a campaign can't launch without, such as `postal_address`. Empty when none are missing.
        created_at:
          type: string
          format: date-time
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        from_name:
          type: [string, "null"]
          maxLength: 100
          description: One line, without quotes or angle brackets. `null` removes it.
        from_email:
          type: [string, "null"]
          format: email
          maxLength: 254
          description: "`null` removes it."
        postal_address:
          type: [string, "null"]
          maxLength: 500
          description: Up to 8 lines separated by `\n`; blank lines are dropped. `null` removes it.
        time_zone:
          type: string
          description: An IANA time zone name, such as `America/New_York` or `UTC`.
    ApiKeyScope:
      type: string
      enum: [full, draft]
      description: |
        `full` can do everything. `draft` can do everything except launch
        campaigns, change billing and manage keys.
    ApiKey:
      type: object
      required: [id, name, scope, hint, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        hint:
          type: string
          description: The secret's prefix and last four characters, to tell keys apart.
          examples: ["mg_live_…k3x9"]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When the key last made a request, to the minute; null if never.
    CreatedApiKey:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The key itself. It's shown only in this response.
          examples: ["mg_live_9w2k4m1qz7d8c3x5v6b0n1p2r3s4t5u6"]
    ApiKeyList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: [string, "null"]
    PlanCheckoutRequest:
      type: object
      additionalProperties: false
      required: [interval]
      properties:
        interval:
          type: string
          enum: [month, year]
          description: Bill each month ($5 a unit) or each year ($50 a unit).
    PlanCheckout:
      type: object
      required: [url, interval, units, unit_price_cents, currency, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Stripe's Checkout page; open it in a browser to pay.
        interval:
          type: string
          enum: [month, year]
        units:
          type: integer
          minimum: 1
          description: Plan units the subscription starts with, from the account's contacts now.
        unit_price_cents:
          type: integer
          description: One unit's price each interval, before any sales tax, in cents.
        currency:
          type: string
          enum: [usd]
        expires_at:
          type: string
          format: date-time
          description: When the page stops working.
    PlanPortal:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Stripe's customer portal page; open it in a browser.
    Plan:
      type: object
      required: [plan, status, interval, units, current_period_end, cancel_at_period_end, contacts, units_needed, prices]
      properties:
        plan:
          type: string
          enum: [free, paid]
        status:
          type: [string, "null"]
          description: |
            Stripe's subscription status: `active`, `past_due` or `unpaid`
            (a renewal failed; sending is paused while Stripe retries the
            card), `canceled`, and so on. Null for an account that never
            subscribed.
        interval:
          type: [string, "null"]
          description: "`month` or `year`; null without a subscription."
        units:
          type: integer
          minimum: 0
          description: Plan units the subscription is billed for; 0 without one.
        current_period_end:
          type: [string, "null"]
          format: date-time
          description: When the paid period ends and the subscription renews, or ends if it's cancelled.
        cancel_at_period_end:
          type: boolean
          description: True when the plan was cancelled and ends at `current_period_end`.
        contacts:
          type: integer
          description: Counted contacts now (subscribed and unconfirmed).
        units_needed:
          type: integer
          minimum: 1
          description: The plan units those contacts make.
        prices:
          type: object
          required: [month_cents, year_cents, currency]
          properties:
            month_cents:
              type: integer
              description: One unit for a month, in cents.
            year_cents:
              type: integer
              description: One unit for a year, in cents.
            currency:
              type: string
              enum: [usd]
    CreditCheckoutRequest:
      type: object
      additionalProperties: false
      required: [pack]
      properties:
        pack:
          type: string
          maxLength: 20
          description: The pack's name, such as `10k`; case doesn't matter.
    CreditCheckout:
      type: object
      required: [url, pack, credits, price_cents, currency, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Stripe's Checkout page; open it in a browser to pay.
        pack:
          type: string
        credits:
          type: integer
        price_cents:
          type: integer
          description: The pack's price before any sales tax, in cents.
        currency:
          type: string
          enum: [usd]
        expires_at:
          type: string
          format: date-time
          description: When the page stops working.
    CreditSummary:
      type: object
      required: [balance, plan, next_grant_at]
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
          description: Credits available now, not counting any reserved for a send in progress.
        plan:
          type: string
          enum: [free, paid]
        next_grant_at:
          type: [string, "null"]
          format: date-time
          description: When the next 1,000 free credits arrive; null on the paid plan.
    CreditTransactionType:
      type: string
      enum: [grant, purchase, reserve, release, spend, fee, expiry]
      description: |
        `grant` is a free monthly grant and `purchase` a bought credit pack.
        `reserve` holds credits for a send and `release` gives back what it
        didn't use. `spend` is credits used directly and `expiry` credits
        that ran out. `fee` isn't used: the paid plan is billed to a card.
    CreditTransaction:
      type: object
      required: [id, type, amount, expires_at, ref, created_at]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/CreditTransactionType"
        amount:
          type: integer
          format: int64
          description: Credits added (positive) or taken (negative).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When a grant's or purchase's credits expire; null for other types.
        ref:
          type: string
          description: What the transaction is for, such as a campaign id; empty when there's nothing to point to.
        created_at:
          type: string
          format: date-time
    CreditTransactionList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CreditTransaction"
        next_cursor:
          type: [string, "null"]
    CreateDeviceLoginRequest:
      type: object
      additionalProperties: false
      properties:
        client_name:
          type: string
          maxLength: 100
          description: Where the login comes from, such as the computer's name; shown on the approval page and used as the token's name.
          examples: [pat-laptop]
    DeviceLoginStart:
      type: object
      required: [device_code, user_code, verification_url, verification_url_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: The CLI's secret for polling. Don't show it.
        user_code:
          type: string
          description: The code the person confirms in the browser.
          examples: [BCDF-GHJK]
        verification_url:
          type: string
          format: uri
          description: Where the person approves the code.
        verification_url_complete:
          type: string
          format: uri
          description: "`verification_url` with the code filled in."
        expires_in:
          type: integer
          description: Seconds until the request expires.
          examples: [600]
        interval:
          type: integer
          description: Seconds to wait between polls.
          examples: [5]
    PollDeviceLoginRequest:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code:
          type: string
          maxLength: 100
    DeviceLoginPending:
      type: object
      required: [status, interval]
      properties:
        status:
          type: string
          enum: [pending]
        interval:
          type: integer
          description: Seconds to wait before polling again.
    DeviceLoginToken:
      type: object
      required: [token, key_id, account, user]
      properties:
        token:
          type: string
          description: A full-scope CLI token (`mg_cli_…`), shown only in this response.
        key_id:
          type: string
          format: uuid
        account:
          $ref: "#/components/schemas/Account"
        user:
          $ref: "#/components/schemas/User"
    DeviceLogin:
      type: object
      required: [user_code, client_name, created_at, expires_at]
      properties:
        user_code:
          type: string
          examples: [BCDF-GHJK]
        client_name:
          type: string
          description: Where the login comes from, as the CLI described it; may be empty.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Whoami:
      type: object
      required: [account, user, auth_method, scope, key_id]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The person behind the request; null for an API key whose maker was removed.
        auth_method:
          type: string
          enum: [session, api_key, cli_token]
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        key_id:
          type: [string, "null"]
          format: uuid
          description: The API key or CLI token used; null for a web session.
    SignupRequest:
      type: object
      required: [email, account_name, accepted_terms]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pat@example.com]
        account_name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Pat's Bakery]
        accepted_terms:
          type: boolean
          description: |
            Must be `true`: the person accepts the terms of service and the
            anti-spam policy. Anything else is a 422 `terms_not_accepted`.
    SignInRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pat@example.com]
    CodeSent:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [code_sent]
        message:
          type: string
          examples: ["Check your email for a six-digit code."]
    SessionRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: The six-digit code from the email.
          examples: ["042917"]
    CliTokenRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: The six-digit code from the email.
          examples: ["042917"]
        client_name:
          type: string
          maxLength: 100
          description: Names the token, such as the computer's name. Defaults to "CLI sign-up".
    Session:
      type: object
      required: [account, user, expires_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      required: [id, name, status, plan, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, active]
        plan:
          type: string
          enum: [free, paid]
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          examples: [v0.1.0]
        commit:
          type: string
          examples: [a1b2c3d]
        build_date:
          type: string
          description: When the server binary was built (RFC 3339), if known.
          examples: ["2026-11-18T12:00:00Z"]
    EmailKind:
      type: string
      enum: [blocks, html]
      description: |
        `blocks`: built from blocks in the designer or with block commands.
        `html`: hand-written HTML, edited as code only.
    Color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      examples: ["#18181b"]
    Align:
      type: string
      enum: [left, center, right]
    BlockId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,40}$"
      description: |
        Stable for the block's life: edits and moves keep it. Leave it out
        when adding a block to get a new one (`b_` and ten letters and
        digits). Unique within the document.
    EmailSettings:
      type: object
      description: |
        The parts of an email outside its content. In a request, fields left
        out take their defaults.
      additionalProperties: false
      required: [subject, preview_text, from_name, from_email, reply_to, background_color, content_width]
      properties:
        subject:
          type: string
          maxLength: 200
          default: ""
        preview_text:
          type: string
          maxLength: 200
          default: ""
          description: The line inboxes show after the subject.
        from_name:
          type: string
          maxLength: 100
          default: ""
        from_email:
          type: [string, "null"]
          format: email
          default: null
          description: Must be at one of the account's verified domains to send (the email check says so).
        reply_to:
          type: [string, "null"]
          format: email
          default: null
        background_color:
          $ref: "#/components/schemas/Color"
          default: "#f4f4f5"
        content_width:
          type: integer
          minimum: 480
          maximum: 800
          default: 600
          description: Pixels, on desktop. Blocks emails only; html emails ignore it.
    EmailSettingsUpdate:
      type: object
      description: Some or all settings. Fields left out keep their values.
      additionalProperties: false
      minProperties: 1
      properties:
        subject:
          type: string
          maxLength: 200
        preview_text:
          type: string
          maxLength: 200
        from_name:
          type: string
          maxLength: 100
        from_email:
          type: [string, "null"]
          format: email
        reply_to:
          type: [string, "null"]
          format: email
        background_color:
          $ref: "#/components/schemas/Color"
        content_width:
          type: integer
          minimum: 480
          maximum: 800
    HeadingBlock:
      type: object
      additionalProperties: false
      required: [id, type, text, level, align]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: heading
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: One line; merge tags allowed.
        level:
          type: integer
          enum: [1, 2, 3]
          default: 1
        align:
          $ref: "#/components/schemas/Align"
          default: left
    TextBlock:
      type: object
      additionalProperties: false
      required: [id, type, text, align]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: |
            A small Markdown subset: `**bold**`, `*italic*`,
            `[link text](https://...)`, lists with `- ` or `1. `, and a blank
            line between paragraphs. Merge tags allowed.
        align:
          $ref: "#/components/schemas/Align"
          default: left
    ImageBlock:
      type: object
      additionalProperties: false
      required: [id, type, src, alt, href, width, align]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: image
        src:
          type: string
          format: uri
          maxLength: 2000
          description: An http or https address, usually one `mailgoose image upload` gave.
        alt:
          type: string
          maxLength: 500
          default: ""
        href:
          type: [string, "null"]
          maxLength: 2000
          default: null
          description: Where a click on the image goes, if anywhere.
        width:
          type: [integer, "null"]
          minimum: 1
          maximum: 800
          default: null
          description: Pixels; null for the full content width.
        align:
          $ref: "#/components/schemas/Align"
          default: center
    ButtonBlock:
      type: object
      additionalProperties: false
      required: [id, type, text, href, align, background_color, text_color]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: button
        text:
          type: string
          minLength: 1
          maxLength: 100
        href:
          type: string
          maxLength: 2000
          description: An http, https or mailto address, or a merge tag such as `{{unsubscribe_url}}`.
        align:
          $ref: "#/components/schemas/Align"
          default: center
        background_color:
          $ref: "#/components/schemas/Color"
          default: "#18181b"
        text_color:
          $ref: "#/components/schemas/Color"
          default: "#ffffff"
    DividerBlock:
      type: object
      additionalProperties: false
      required: [id, type, color, thickness]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: divider
        color:
          $ref: "#/components/schemas/Color"
          default: "#e4e4e7"
        thickness:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
    SpacerBlock:
      type: object
      additionalProperties: false
      required: [id, type, height]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: spacer
        height:
          type: integer
          minimum: 4
          maximum: 200
          default: 24
    SocialBlock:
      type: object
      additionalProperties: false
      required: [id, type, links, align]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: social
        links:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [network, url]
            properties:
              network:
                type: string
                enum: [facebook, instagram, x, linkedin, youtube, tiktok, threads, bluesky, website]
              url:
                type: string
                format: uri
                maxLength: 2000
        align:
          $ref: "#/components/schemas/Align"
          default: center
    FooterBlock:
      type: object
      description: |
        The locked last block of every blocks email. Rendering adds the
        account's postal address and the unsubscribe link; `text` is an
        optional line above them.
      additionalProperties: false
      required: [id, type, text]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: footer
        text:
          type: string
          maxLength: 1000
          default: ""
    ColumnsBlock:
      type: object
      description: A row of two columns, each holding blocks other than columns and the footer.
      additionalProperties: false
      required: [id, type, columns]
      properties:
        id:
          $ref: "#/components/schemas/BlockId"
        type:
          type: string
          const: columns
        columns:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [blocks]
            properties:
              blocks:
                type: array
                items:
                  $ref: "#/components/schemas/ColumnContentBlock"
    ColumnContentBlock:
      description: A block that can go inside a column.
      oneOf:
        - $ref: "#/components/schemas/HeadingBlock"
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/ImageBlock"
        - $ref: "#/components/schemas/ButtonBlock"
        - $ref: "#/components/schemas/DividerBlock"
        - $ref: "#/components/schemas/SpacerBlock"
        - $ref: "#/components/schemas/SocialBlock"
      discriminator:
        propertyName: type
        mapping:
          heading: "#/components/schemas/HeadingBlock"
          text: "#/components/schemas/TextBlock"
          image: "#/components/schemas/ImageBlock"
          button: "#/components/schemas/ButtonBlock"
          divider: "#/components/schemas/DividerBlock"
          spacer: "#/components/schemas/SpacerBlock"
          social: "#/components/schemas/SocialBlock"
    Block:
      description: One block of a document, by `type` (DES-2).
      oneOf:
        - $ref: "#/components/schemas/HeadingBlock"
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/ImageBlock"
        - $ref: "#/components/schemas/ButtonBlock"
        - $ref: "#/components/schemas/DividerBlock"
        - $ref: "#/components/schemas/SpacerBlock"
        - $ref: "#/components/schemas/ColumnsBlock"
        - $ref: "#/components/schemas/SocialBlock"
        - $ref: "#/components/schemas/FooterBlock"
      discriminator:
        propertyName: type
        mapping:
          heading: "#/components/schemas/HeadingBlock"
          text: "#/components/schemas/TextBlock"
          image: "#/components/schemas/ImageBlock"
          button: "#/components/schemas/ButtonBlock"
          divider: "#/components/schemas/DividerBlock"
          spacer: "#/components/schemas/SpacerBlock"
          columns: "#/components/schemas/ColumnsBlock"
          social: "#/components/schemas/SocialBlock"
          footer: "#/components/schemas/FooterBlock"
    BlockDocument:
      type: object
      description: |
        A blocks email's settings and content, schema version 1. Blocks come
        in order, at most 200 counting those inside columns, and the last is
        the footer. Unknown block types and fields are refused. In a
        request, `schema_version` may be left out, and so may block ids and
        fields that have defaults.
      additionalProperties: false
      required: [schema_version, settings, blocks]
      properties:
        schema_version:
          type: integer
          const: 1
        settings:
          $ref: "#/components/schemas/EmailSettings"
        blocks:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Block"
    HtmlDocument:
      type: object
      description: An html email's settings and its markup. importEmailHtml lists the checks the markup must pass.
      additionalProperties: false
      required: [schema_version, settings, html]
      properties:
        schema_version:
          type: integer
          const: 1
        settings:
          $ref: "#/components/schemas/EmailSettings"
        html:
          type: string
          maxLength: 512000
    EmailDocument:
      description: A BlockDocument for a blocks email, an HtmlDocument for an html one.
      oneOf:
        - $ref: "#/components/schemas/BlockDocument"
        - $ref: "#/components/schemas/HtmlDocument"
    Email:
      type: object
      additionalProperties: false
      required: [id, name, kind, version, document, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: For the account's own use; recipients never see it.
        kind:
          $ref: "#/components/schemas/EmailKind"
        version:
          type: integer
          minimum: 1
          description: Goes up by one with every save. Updates name the version they read.
        document:
          $ref: "#/components/schemas/EmailDocument"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmailSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, version, subject, block_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EmailKind"
        version:
          type: integer
          minimum: 1
        subject:
          type: string
        block_count:
          type: integer
          description: Blocks at the top level, footer included; 0 for an html email.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FormField:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          enum: [email, first_name, last_name]
        label:
          type: string
          maxLength: 100
          description: What the field is called on the form. Empty takes the default ("Email", "First name", "Last name").
        required:
          type: boolean
          default: false
          description: Email is always required.
    Form:
      type: object
      required: [id, name, fields, tags, button_text, success_message, redirect_url, double_opt_in,
        confirm_subject, confirm_text, signups, confirmations, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fields:
          type: array
          description: The fields the form asks for, in order.
          items:
            $ref: "#/components/schemas/FormField"
        tags:
          type: array
          description: Tags put on everyone who signs up with the form.
          items:
            $ref: "#/components/schemas/TagRef"
        button_text:
          type: string
        success_message:
          type: string
          description: Shown after someone signs up, unless there's a redirect_url.
        redirect_url:
          type: [string, "null"]
          description: Where people go after signing up, instead of seeing the success message.
        double_opt_in:
          type: boolean
          description: When on, people get an email to confirm before they're subscribed.
        confirm_subject:
          type: string
          description: The confirmation email's subject.
        confirm_text:
          type: string
          description: The confirmation email's text, above its confirm link.
        signups:
          type: integer
          description: >-
            How many submissions the form has taken, bots' left out. A
            person who signs up twice counts twice.
        confirmations:
          type: integer
          description: How many confirm links from the form's confirmation emails have been used.
        problems:
          type: array
          description: >-
            Only on getting one form: what stops it taking signups, empty
            when it can. `no_verified_from`: the form uses double opt-in and
            the account has no From address on a verified sending domain to
            send the confirmation email from.
          items:
            $ref: "#/components/schemas/FormProblem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FormProblem:
      type: object
      required: [code, message, hint]
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
    Image:
      type: object
      required: [id, url, file_name, content_type, bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Where the image is served from; use it as an image block's `src`.
        file_name:
          type: string
          description: The uploaded file's name, for showing; empty if none was given.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        bytes:
          type: integer
        created_at:
          type: string
          format: date-time
    ImageList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        next_cursor:
          type: [string, "null"]
    UploadImageRequest:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: string
          format: byte
          description: The file, in standard base64 with padding. Anything else is a 400.
        file_name:
          type: string
          maxLength: 200
          description: The file's name, for showing in lists. It doesn't decide the type.
    FormList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Form"
        next_cursor:
          type: [string, "null"]
    CreateFormRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fields:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/FormField"
        tag_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        button_text:
          type: string
          maxLength: 50
        success_message:
          type: string
          maxLength: 500
        redirect_url:
          type: string
          maxLength: 2000
          description: A full https:// address, or empty for none.
        double_opt_in:
          type: boolean
          default: true
        confirm_subject:
          type: string
          maxLength: 200
        confirm_text:
          type: string
          maxLength: 2000
    UpdateFormRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fields:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/FormField"
        tag_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        button_text:
          type: string
          maxLength: 50
        success_message:
          type: string
          maxLength: 500
        redirect_url:
          type: string
          maxLength: 2000
        double_opt_in:
          type: boolean
        confirm_subject:
          type: string
          maxLength: 200
        confirm_text:
          type: string
          maxLength: 2000
    FormEmbed:
      type: object
      required: [action_url, html, script]
      properties:
        action_url:
          type: string
          description: Where the form posts.
        html:
          type: string
          description: The form, with its styles. Works without JavaScript.
        script:
          type: string
          description: Optional. Paste it after the form to show the result in the page.
    CampaignStatus:
      type: string
      enum: [draft, scheduled, sending, sent, cancelled, paused, failed]
      description: |
        `draft` is being set up; `scheduled` is launched and waiting for its
        send time; `sending`, then `sent`. `cancelled` was stopped by the
        account, `paused` by us mid-send, and `failed` couldn't finish.
    CampaignRecipients:
      type: object
      required: [all, tags]
      properties:
        all:
          type: boolean
          description: True sends to every subscribed contact; tags is then empty.
        tags:
          type: array
          description: Otherwise the subscribed contacts with any of these tags.
          items:
            $ref: "#/components/schemas/TagRef"
    RecipientsInput:
      type: object
      additionalProperties: false
      description: '`{"all": true}` for every subscribed contact, or `{"tag_ids": [...]}` for those with any of the tags.'
      properties:
        all:
          type: boolean
        tag_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    Campaign:
      type: object
      required: [id, name, email_id, recipients, send_at, tracking, status, version, last_test, launch, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email_id:
          type: [string, "null"]
          description: The email it sends. Null when a draft's email was deleted.
        recipients:
          $ref: "#/components/schemas/CampaignRecipients"
        recipient_count:
          type: integer
          description: How many contacts the recipients reach now. Single-campaign responses only.
        send_at:
          type: [string, "null"]
          format: date-time
          description: When it goes out; null for when it's launched.
        tracking:
          type: boolean
          description: |
            Whether opens and clicks are counted, with mailgoose's own open
            pixel and link redirects. On by default; off means no pixel and
            no rewritten links. The unsubscribe link is never rewritten.
        status:
          $ref: "#/components/schemas/CampaignStatus"
        version:
          type: integer
          description: Goes up with every change.
        last_test:
          description: The campaign's last test send; null before the first.
          oneOf:
            - $ref: "#/components/schemas/CampaignTest"
            - type: "null"
        launch:
          description: When the campaign was launched, to how many and for how many credits; null for a draft.
          oneOf:
            - $ref: "#/components/schemas/CampaignLaunch"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CampaignReport:
      type: object
      required: [campaign_id, status, launched_at, tracking, recipients, delivered, bounced, complaints, unsubscribes, opens, clicks, credits_used, links, archived, as_of]
      properties:
        campaign_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CampaignStatus"
        launched_at:
          type: [string, "null"]
          format: date-time
          description: When it was launched; null for a draft.
        tracking:
          type: boolean
          description: Whether opens and clicks were counted.
        recipients:
          type: integer
          description: Copies sent.
        delivered:
          type: integer
          description: Copies SES delivered to the receiving mail server.
        bounced:
          type: integer
          description: Copies that hard bounced.
        complaints:
          type: integer
          description: Copies marked as spam.
        unsubscribes:
          type: integer
          description: People who unsubscribed from this campaign's link.
        opens:
          description: Null when the campaign wasn't tracked.
          oneOf:
            - $ref: "#/components/schemas/ReportOpens"
            - type: "null"
        clicks:
          description: Null when the campaign wasn't tracked.
          oneOf:
            - $ref: "#/components/schemas/ReportClicks"
            - type: "null"
        credits_used:
          type: integer
          description: |
            Credits the campaign took. While it's sending, this includes the
            credits held for copies still to go.
        links:
          type: array
          description: Clicks per link, in the email's order; only links someone clicked.
          items:
            $ref: "#/components/schemas/ReportLink"
        archived:
          type: boolean
          description: True when the raw events are gone and these are the numbers saved 12 months after launch.
        as_of:
          type: string
          format: date-time
          description: When these numbers were counted.
    ReportOpens:
      type: object
      required: [unique, estimated]
      properties:
        unique:
          type: integer
          description: Copies opened at least once (or clicked).
        estimated:
          type: boolean
          description: |
            Always true: mail apps that load images for privacy open every
            copy, and those that block images open none.
    ReportClicks:
      type: object
      required: [unique, total]
      properties:
        unique:
          type: integer
          description: Copies with at least one click.
        total:
          type: integer
          description: All clicks.
    ReportLink:
      type: object
      required: [position, url, varies, unique_clicks, total_clicks]
      properties:
        position:
          type: integer
          description: The link's place among the email's links, from 1.
        url:
          type: string
          description: |
            Where it goes. When merge tags make it differ between copies,
            only the site (scheme and host), so no one person's link shows.
        varies:
          type: boolean
          description: True when the address differs between copies.
        unique_clicks:
          type: integer
        total_clicks:
          type: integer
    CampaignLaunch:
      type: object
      required: [at, recipient_count, credits_reserved]
      properties:
        at:
          type: string
          format: date-time
          description: When it was launched.
        recipient_count:
          type: integer
          description: Who it goes to, fixed at launch.
        credits_reserved:
          type: integer
          description: Credits held for them; any not used are given back.
    LaunchCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        confirm:
          type: string
          maxLength: 20
          description: |
            The code from the launch summary, given only after the person
            said yes to it. Any case; the dash is optional.
    RescheduleCampaignRequest:
      type: object
      additionalProperties: false
      required: [send_at]
      properties:
        send_at:
          type: string
          format: date-time
          description: The new send time, with its offset; stored in UTC.
    LaunchResult:
      type: object
      required: [campaign, recipient_count, credits_reserved]
      properties:
        campaign:
          $ref: "#/components/schemas/Campaign"
        recipient_count:
          type: integer
          description: Who the campaign goes to, fixed at launch.
        credits_reserved:
          type: integer
          description: Credits held for them now.
    CampaignTest:
      type: object
      required: [at, version, email_version]
      properties:
        at:
          type: string
          format: date-time
          description: When the test went out.
        version:
          type: integer
          description: The campaign's version it was made from.
        email_version:
          type: integer
          description: The email's version it was made from.
    TestCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        to:
          type: array
          maxItems: 5
          items:
            type: string
            format: email
          description: Who gets the test. Left out or empty, the account owner.
    TestSendResult:
      type: object
      required: [campaign, to, sent_today, daily_limit]
      properties:
        campaign:
          $ref: "#/components/schemas/Campaign"
        to:
          type: array
          items:
            type: string
          description: Who each copy went to.
        sent_today:
          type: integer
          description: Test emails the account sent in the last 24 hours, these included.
        daily_limit:
          type: integer
          description: Test emails an account can send in any 24 hours.
    CampaignList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        next_cursor:
          type: [string, "null"]
    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required: [name, email_id, recipients]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email_id:
          type: string
          format: uuid
        recipients:
          $ref: "#/components/schemas/RecipientsInput"
        send_at:
          type: [string, "null"]
          format: date-time
          description: A time in the next year; null or left out sends when launched.
        tracking:
          type: boolean
          description: Count opens and clicks (the default, true), or not.
    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email_id:
          type: string
          format: uuid
        recipients:
          $ref: "#/components/schemas/RecipientsInput"
        send_at:
          type: [string, "null"]
          format: date-time
          description: A time in the next year; null sends when launched.
        tracking:
          type: boolean
          description: Count opens and clicks (the default, true), or not.
        version:
          type: integer
          description: The version you read; the change is refused if the campaign changed since.
    RecipientCountRequest:
      type: object
      additionalProperties: false
      required: [recipients]
      properties:
        recipients:
          $ref: "#/components/schemas/RecipientsInput"
    RecipientCount:
      type: object
      required: [recipient_count]
      properties:
        recipient_count:
          type: integer
    EmailList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmailSummary"
        next_cursor:
          type: [string, "null"]
    CreateEmailRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/EmailKind"
          default: blocks
        document:
          $ref: "#/components/schemas/EmailDocument"
    UpdateEmailRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/EmailSettingsUpdate"
    ReplaceEmailDocumentRequest:
      type: object
      additionalProperties: false
      required: [version, document]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        document:
          $ref: "#/components/schemas/EmailDocument"
    ImportEmailHtmlRequest:
      type: object
      additionalProperties: false
      required: [version, html]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        html:
          type: string
          maxLength: 512000
          description: The whole markup. Over 102 KB is refused as `too_large`.
    ImportEmailHtmlResult:
      type: object
      additionalProperties: false
      required: [email, warnings]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        warnings:
          type: array
          description: CSS that some clients drop; the email still sends.
          items:
            $ref: "#/components/schemas/HtmlIssue"
    HtmlIssue:
      type: object
      additionalProperties: false
      required: [line, code, message]
      properties:
        line:
          type: integer
          minimum: 1
          description: The line it's on, counting from 1.
        code:
          type: string
          enum: [malformed_markup, script, form, iframe, embedded_object, external_stylesheet,
            event_handler, javascript_url, data_url, redirect, missing_unsubscribe, too_large,
            unsupported_css]
        message:
          type: string
    EmailCheck:
      type: object
      additionalProperties: false
      required: [ok, errors, warnings]
      properties:
        ok:
          type: boolean
          description: True when there are no errors, so the email can be sent.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/EmailCheckIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/EmailCheckIssue"
    EmailCheckIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing_subject, missing_from, unverified_from, missing_postal_address, empty_email,
            merge_tag, missing_unsubscribe, broken_link, too_large, invalid_html, insecure_link,
            link_unreachable, link_not_checked, missing_alt, near_size_limit, unsupported_css]
        message:
          type: string
        path:
          type: string
          description: The block field or setting it's about, such as `blocks[2].alt` or `settings.subject`.
        line:
          type: integer
          minimum: 1
          description: The line of an html email's markup it's on.
        url:
          type: string
          description: The link it's about.
    DuplicateEmailRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    AddEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version, block]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        block:
          type: object
          description: |
            A Block with at least its `type`. `id` and fields with defaults
            may be left out. A footer can't be added; every blocks email
            already has one.
          required: [type]
          properties:
            type:
              type: string
        after:
          $ref: "#/components/schemas/BlockId"
        index:
          type: integer
          minimum: 0
        parent_id:
          $ref: "#/components/schemas/BlockId"
        column:
          type: integer
          minimum: 0
          maximum: 1
    UpdateEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        fields:
          type: object
          minProperties: 1
          description: The block's fields to set, by name, as in its Block schema. Not `id` or `type`.
    MoveEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: The new place, as in BlockPlace.
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        after:
          $ref: "#/components/schemas/BlockId"
        index:
          type: integer
          minimum: 0
        parent_id:
          $ref: "#/components/schemas/BlockId"
        column:
          type: integer
          minimum: 0
          maximum: 1
    EmailBlockEntry:
      type: object
      additionalProperties: false
      required: [block, path, parent_id, column, index]
      properties:
        block:
          $ref: "#/components/schemas/Block"
        path:
          type: string
          description: The block's place, as in an `invalid_document` error, such as `blocks[2].columns[0].blocks[1]`.
        parent_id:
          type: [string, "null"]
          description: The columns block holding it; null at the top level.
        column:
          type: [integer, "null"]
          description: Which column of `parent_id` holds it; null at the top level.
        index:
          type: integer
          description: Its place in its list, 0 first.
    EmailBlockList:
      type: object
      additionalProperties: false
      required: [email_id, version, data]
      properties:
        email_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmailBlockEntry"
    EmailBlockChange:
      type: object
      additionalProperties: false
      required: [block, email]
      properties:
        block:
          $ref: "#/components/schemas/EmailBlockEntry"
        email:
          $ref: "#/components/schemas/Email"
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, hint]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [database_unavailable]
            message:
              type: string
              description: Human-readable explanation.
            hint:
              type: string
              description: What to do about it. Empty when there's nothing to add.
              examples: ["Wait 20 seconds (see Retry-After) and try again."]
            details:
              type: object
              description: |
                Extra facts some errors carry; absent otherwise. A
                `contact_limit` has `limit` and `count`, an
                `invalid_document` has `path`, and a `version_conflict` has
                `current_version`.
              additionalProperties: true
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: Why, for the admin log (and, for a pause, the account). At most 500 characters.
    GrantCreditsRequest:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        reason:
          type: string
    AdminRates:
      type: object
      description: Copies sent, and the recipients who hard bounced or complained.
      required: [sent, hard_bounces, complaints]
      properties:
        sent:
          type: integer
        hard_bounces:
          type: integer
        complaints:
          type: integer
    AdminAccountSummary:
      type: object
      required: [id, name, status, plan, owner_email, sending_paused_at, sending_paused_reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        plan:
          type: string
        owner_email:
          type: [string, "null"]
        sending_paused_at:
          type: [string, "null"]
          format: date-time
        sending_paused_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    AdminAccountList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountSummary"
        next_cursor:
          type: "null"
    AdminHeldImport:
      type: object
      required: [id, file_name, total_rows, hold_reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: [string, "null"]
        total_rows:
          type: integer
        hold_reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    AdminLiveCampaign:
      type: object
      required: [id, name, status, send_at, recipients, rates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        send_at:
          type: [string, "null"]
          format: date-time
        recipients:
          type: integer
        rates:
          $ref: "#/components/schemas/AdminRates"
    AdminAccount:
      allOf:
        - $ref: "#/components/schemas/AdminAccountSummary"
        - type: object
          required: [daily_send_limit, contacts, credit_balance, last_30_days, held_imports, live_campaigns]
          properties:
            daily_send_limit:
              type: [integer, "null"]
              description: The account's own daily limit; null follows the schedule.
            contacts:
              type: integer
            credit_balance:
              type: integer
              format: int64
            last_30_days:
              $ref: "#/components/schemas/AdminRates"
            held_imports:
              type: array
              items:
                $ref: "#/components/schemas/AdminHeldImport"
            live_campaigns:
              type: array
              items:
                $ref: "#/components/schemas/AdminLiveCampaign"
    CreditGrant:
      type: object
      required: [account_id, amount, expires_at, credit_balance]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        credit_balance:
          type: integer
          format: int64
    ApprovedImport:
      type: object
      required: [id, account_id, contacts_released]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        contacts_released:
          type: integer
          format: int64
          description: How many of its contacts can now be mailed.
    AdminAction:
      type: object
      required: [id, actor, action, account_id, target_id, reason, details, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
          description: The admin's address, `mailgoosed` (the server's command line) or `automatic`.
        action:
          type: string
          enum: [grant_admin, revoke_admin, pause, unpause, auto_pause, stop_campaign, approve_import, grant_credits]
        account_id:
          type: [string, "null"]
          format: uuid
        target_id:
          type: [string, "null"]
          description: The campaign, import or user acted on.
        reason:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AdminActionList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAction"
        next_cursor:
          type: [string, "null"]
  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out for the first page.
      schema:
        type: string
    DomainId:
      name: domain_id
      in: path
      required: true
      description: The domain's `id`.
      schema:
        type: string
        format: uuid
    ContactId:
      name: contact_id
      in: path
      required: true
      description: The contact's `id`.
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      description: The tag's `id`.
      schema:
        type: string
        format: uuid
    AccountId:
      name: account_id
      in: path
      required: true
      description: The account's `id`.
      schema:
        type: string
        format: uuid
    ImportId:
      name: import_id
      in: path
      required: true
      description: The import's `id`.
      schema:
        type: string
        format: uuid
    BlockId:
      name: block_id
      in: path
      required: true
      description: The block's `id`.
      schema:
        $ref: "#/components/schemas/BlockId"
    FormId:
      name: form_id
      in: path
      required: true
      description: The form's `id`.
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaign_id
      in: path
      required: true
      description: The campaign's `id`.
      schema:
        type: string
        format: uuid
    EmailId:
      name: email_id
      in: path
      required: true
      description: The email's `id`.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry safe. A repeat with the same key and request within 24
        hours returns the stored response instead of running again; the same
        key with a different request is a 422 `idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    X-Request-Id:
      description: Identifies this request in our logs. Quote it when reporting a problem.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left before the limit applies.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    AdminAccount:
      description: The account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAccount"
    InvalidAdminRequest:
      description: |
        `invalid_admin_request`: `details.field` is `reason` (missing, or over
        500 characters) or `amount` (not 1 to 1,000,000).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlanConflict:
      description: |
        `plan_required`: credit packs are for the paid plan; start it with
        createPlanCheckout. `already_subscribed`: the account is already on
        the paid plan. `not_subscribed`: the account has no subscription to
        manage.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnknownPack:
      description: |
        `unknown_pack`: there's no pack by that name; `details.packs` lists
        the packs with their credits and prices.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentProviderError:
      description: "`payment_provider_error`: Stripe couldn't make the Checkout page; try again shortly."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TagConflict:
      description: "`tag_exists`: the account already has a tag with that name, ignoring case."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContactLimit:
      description: |
        `contact_limit`: a free account holds at most 500 counted contacts
        (unconfirmed and subscribed). `details.limit` is the limit and
        `details.count` the counted contacts now. Paid accounts have no cap.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ImportRefused:
      description: |
        The file can't be imported, and nothing was queued. `code` says why:
        `no_rows`, `no_email_column` (name the column in `columns.email`),
        `invalid_mapping` (a named column isn't in the header),
        `invalid_encoding` (not UTF-8), `invalid_csv` (a quote never closes),
        `too_many_rows` (over 100,000), `file_too_large`, `tag_not_found` or
        `too_many_tags`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestTooLarge:
      description: "`request_too_large`: the request body is over the operation's limit."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContactConflict:
      description: "`contact_exists`: the account already has a contact with that address."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainConflict:
      description: |
        `domain_exists`: this account already has the domain.
        `domain_taken`: another mailgoose account has it.
        `domain_unavailable`: the domain is already set up in Amazon SES
        outside mailgoose's reach. Contact support for either of the last two.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: |
        The request is well formed but a field is wrong. `code` says which
        problem, such as `invalid_email`, `invalid_account_name`,
        `terms_not_accepted` or `invalid_code`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidEmail:
      description: |
        `invalid_document`: the document breaks the schema; `message` names
        the place, such as `blocks[2].href`, and `details.path` holds it.
        `invalid_name` (empty or over 200 characters), `invalid_kind` (not
        blocks or html) or `kind_mismatch` (a document of the other kind).
        `invalid_html`: an html document's markup has errors, listed in
        `details.issues` as importEmailHtml describes; empty markup is
        allowed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidHtml:
      description: |
        `invalid_html`: the markup has errors and nothing changed.
        `details.issues` lists each, with its `line`, `code` and `message`;
        `message` names the first. `kind_mismatch`: the email is a blocks
        email, which has no markup.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidImage:
      description: |
        `invalid_image`: the file is empty, over 5 MB, or isn't a JPEG,
        PNG, GIF or WebP; `details.detected` says what it looks like when
        it's another kind of file.
        `too_many_images`: the account already keeps 1,000 images.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidForm:
      description: |
        `invalid_form`: a part of the form breaks a rule; `details.field`
        names it (such as `redirect_url` or `fields[1].name`).
        `unknown_tag`: a tag id isn't one of the account's tags.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCampaign:
      description: |
        `invalid_campaign`: a part breaks a rule; `details.field` names it
        (`name`, `email_id`, `recipients` or `send_at`). `unknown_email` and
        `unknown_tag`: an id isn't one of the account's.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CampaignConflict:
      description: |
        `campaign_locked`: only drafts can be changed, tested, launched or
        deleted; `details.status` is the campaign's status.
        `version_conflict`: the campaign changed since the version given;
        `details.current_version` is its version now.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestNotSendable:
      description: |
        `not_ready`: something stops the email being sent;
        `details.problems` lists each with its `code` (`no_email`,
        `missing_from`, `unverified_from`, `missing_postal_address`,
        `missing_subject`, `empty_email`, `merge_tag`, `invalid_html`), `message`
        and `hint`.
        `invalid_test`: `to` has an address that isn't one, or more than 5.
        `test_recipient_not_allowed`: an address in `to` isn't the owner's
        or on a verified sending domain; `details.address` names it.
        `test_recipient_suppressed`: an address in `to` unsubscribed,
        bounced or complained (the owner's own address is never refused);
        `details.address` names it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchConfirmation:
      description: |
        `confirmation_required`: nothing was launched. `details.summary`
        (`campaign_id`, `name`, `subject`, `from`, `reply_to`,
        `recipient_count`, `send_at`, `credits`, `balance`, `warnings`) is
        what the person confirms, `details.code` the code that launches it
        once they say yes, and `details.expires_at` when the code stops
        working. `campaign_locked`: the campaign isn't a draft and wasn't
        launched; `details.status` is its status.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchRefused:
      description: |
        `not_ready`: the campaign can't launch; `details.problems` lists
        each reason with its `code`, `message` and `hint`: Prepare's
        (`no_email`, `missing_from`, `unverified_from`,
        `missing_postal_address`, `missing_subject`, `empty_email`,
        `merge_tag`), `check_failed` (an email check error), `untested` (no
        test since the last change), `send_at_passed`, `account_paused`,
        `subscription_past_due` (sending is paused until the paid plan's
        payment goes through), `no_recipients`, and `credits_short` with `details.needed`,
        `details.balance` and `details.short`. `invalid_confirmation`: the
        code can't be used; `details.reason` is `no_code`, `expired`,
        `wrong`, `too_many_attempts`, `changed`, or `audience_grew` (the
        campaign now reaches more than a tenth more contacts than the
        summary counted, with `details.summarized_count` and
        `details.recipient_count`). Ask for a new summary.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestLimited:
      description: |
        `test_limit`: the account has sent 50 test emails in the last 24
        hours; Retry-After says when enough have aged out. `rate_limited`:
        the API's request limit.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestSendFailed:
      description: "`test_send_failed`: the mail provider refused or didn't answer. It still counts toward the day's tests."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnrenderableEmail:
      description: |
        `invalid_merge_tags`: a merge tag can't be filled or a link is
        unsafe; `details.problems` lists each with its `path` (such as
        `blocks[2].text`, or `html`) and `message`. `empty_email`: an html
        email with no markup yet. `invalid_html`: the html email's markup
        fails the import check (possible only for markup saved before a
        check was added); `details.problems` lists each with its `line`,
        `code` and `message`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidBlockChange:
      description: |
        `kind_mismatch`: the email is html, which has no blocks.
        `invalid_document`: the block or the fields break the schema, or the
        change would (such as columns inside a column); `details.path` names
        the place. `footer_locked`: the change would remove or move the
        footer, add a second one, or put a block after it.
        `invalid_position`: the place can't be used, such as `after` a block
        that isn't there or `column` without `parent_id`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BlockNotFound:
      description: |
        `not_found`: there's no such email in this account.
        `block_not_found`: the email has no block with that id.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmailVersionConflict:
      description: |
        `version_conflict`: the email was saved since the version given was
        read, and nothing changed. `details.current_version` is its version
        now; read it again and redo the change.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        `service_unavailable`: a dependency the endpoint needs (the database,
        or Amazon SES for domains) isn't configured or reachable. Try again
        later.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        `unauthenticated`: no API key or session cookie, or the session has
        ended. `invalid_api_key`: the key is wrong or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        `insufficient_scope`: a draft-scope key can't do this; use a full-scope
        key or the web app. `cross_origin_request`: a browser sent this from
        another site. `admin_only`: only a signed-in mailgoose admin can do
        this.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: there's no such thing in this account."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: |
        `cross_origin_request`: a browser sent this from another site. Only
        the web app's own origin may change things with a session cookie.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited (`rate_limited`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: |
        `idempotency_key_reused` (422): the key was used for a different
        request. `idempotency_request_in_progress` (409) is returned instead
        while the first request with the key is still running.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
