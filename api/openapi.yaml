openapi: 3.1.0
info:
  title: mailgoose API
  version: 0.1.0
  description: |
    One REST API shared by the web app, the CLI and AI agents. Every endpoint
    here gets a matching `mailgoose` CLI command.

    Conventions every endpoint follows:

    - Errors use the `Error` schema: `{"error": {"code", "message", "hint"}}`,
      with a stable `code` to branch on.
    - Lists take the `Limit` and `Cursor` parameters and return
      `{"data": [...], "next_cursor": "..." | null}`.
    - Every response carries `X-Request-Id`.
    - POST, PUT, PATCH and DELETE accept an `Idempotency-Key` header; a repeat
      within 24 hours returns the stored response with
      `Idempotent-Replayed: true`.
    - Requests are rate limited per API key; responses carry `RateLimit-Limit`
      and `RateLimit-Remaining`, and a 429 carries `Retry-After`.

    The web app signs in with emailed codes and a session cookie. Browser
    requests that change something and carry no `Authorization` header must
    come from the web app's own origin (a 403 `cross_origin_request`
    otherwise). Everything else authenticates with an API key or CLI token:
    API keys sent as bearer tokens, which the CLI reads from `MAILGOOSE_API_KEY`
    or its config file. Operations marked `x-required-scope: full` refuse
    draft-scope keys with a 403 `insufficient_scope`.
servers:
  - url: https://api.staging.mailgoose.app
    description: Staging
  - url: http://localhost:8080
    description: Local
security:
  - apiKey: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      description: |
        Says the process is up. The load balancer polls it, so it does not
        check the database. The CLI's `mailgoose status` calls it.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Like /healthz, and also checks that the database answers.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API and its database are up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not configured or not reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/account:
    get:
      operationId: getAccount
      summary: Show account settings
      description: |
        The account's name, plan, default From name and address, postal
        address and time zone. `missing_for_send` lists the settings a
        campaign can't launch without.
      tags: [account]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateAccount
      summary: Change account settings
      description: |
        Changes only the fields sent. Send `null` to remove the default From
        name, From address or postal address; the name and time zone can't be
        removed. The postal address goes in the footer of every email, as
        anti-spam law requires, and campaigns can't launch without it. The
        From address is checked for format here; a campaign can only send
        from a domain verified for the account.
      tags: [account]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: The account after the change.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: The account's active API keys, oldest first. Secrets are never shown again.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of keys.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Makes a key and answers with its secret, which is shown only this
        once; store it somewhere safe. Keys made in production start
        `mg_live_`, and keys made anywhere else start `mg_test_`. A `draft` key
        can do everything except launch campaigns, change billing and manage
        keys. An account can have 50 active keys.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The new key, with its secret.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: The key stops working on its next request. This can't be undone.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: key_id
          in: path
          required: true
          description: The key's `id`.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credits:
    get:
      operationId: getCredits
      summary: Show the credit balance
      description: |
        The account's balance, its plan, and when its next free grant comes.
        One credit sends one email to one recipient. Free accounts get 1,000
        credits when they activate and on each monthly anniversary of that,
        and unused free credits expire when the next grant arrives.
      tags: [credits]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The balance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credits/transactions:
    get:
      operationId: listCreditTransactions
      summary: List credit transactions
      description: |
        Every change to the balance, newest first: grants, purchases,
        reservations for a send and their release, spends, fees and expiries.
        Amounts are signed, so the balance is their sum.
      tags: [credits]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of transactions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditTransactionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins:
    post:
      operationId: createDeviceLogin
      summary: Start a CLI login
      description: |
        Starts the device login that `mailgoose login` uses. Show the person
        `user_code` and `verification_url`; they sign in to the web app and
        approve the code there. Meanwhile poll `pollDeviceLogin` with
        `device_code` every `interval` seconds. The request expires after
        `expires_in` seconds (10 minutes).
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceLoginRequest"
      responses:
        "201":
          description: The request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect a CLI login token
      description: |
        Polled by `mailgoose login`. Answers 202 while the request awaits
        approval, and 200 with a full-scope CLI token (`mg_cli_…`) once it's
        approved; the token is given out only once. A denied request is a 403
        `device_login_denied`; an expired, unknown or already collected one
        is a 410 `device_login_expired`. Polling faster than `interval` is a
        429 `slow_down`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollDeviceLoginRequest"
      responses:
        "200":
          description: Approved. The token is shown only in this response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginToken"
        "202":
          description: Not approved yet; poll again after `interval` seconds.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginPending"
        "403":
          description: The person denied the request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The request expired, doesn't exist or was already collected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}:
    get:
      operationId: getDeviceLogin
      summary: Show a CLI login awaiting approval
      description: |
        For the approval page: the request under this code, if it's still
        awaiting approval. Needs a signed-in web session; API keys and CLI
        tokens get a 401.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: The request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}/approve:
    post:
      operationId: approveDeviceLogin
      summary: Approve a CLI login
      description: |
        Lets the CLI that started this request sign in as the signed-in
        person, with a full-scope token. Needs a signed-in web session.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "204":
          description: Approved; the CLI collects its token on its next poll.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}/deny:
    post:
      operationId: denyDeviceLogin
      summary: Deny a CLI login
      description: The CLI that started this request stops waiting and signs nothing in. Needs a signed-in web session.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "204":
          description: Denied.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/cli-tokens/current:
    delete:
      operationId: revokeCurrentCliToken
      summary: Sign out the CLI
      description: |
        Revokes the CLI token this request is made with, for `mailgoose
        logout`. Only CLI tokens (`mg_cli_…`); revoke API keys with
        `revokeApiKey`.
      tags: [auth]
      security:
        - apiKey: []
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: The request wasn't made with a CLI token (code `not_a_cli_token`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/whoami:
    get:
      operationId: getWhoami
      summary: Who is calling
      description: The account, the person and the kind of credential behind this request.
      tags: [auth]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The caller.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/signup:
    post:
      operationId: createSignup
      summary: Sign up
      description: |
        Creates a pending account on the free plan and emails a six-digit code
        to the address; using the code with `createSession` activates the
        account. The answer is the same whether or not the address already
        has an account: an address with an active account gets a sign-in code
        instead, and no new account is made. A repeat within a minute sends no
        new email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: A code is on its way, if the address can receive one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sign-in:
    post:
      operationId: createSignIn
      summary: Email a sign-in code
      description: |
        Emails a six-digit code to an address with an account; use it with
        `createSession`. The answer is the same whether or not the address has
        an account, and an address with no account gets no email. An account
        that hasn't finished signing up gets its sign-up code instead. A repeat
        within a minute sends no new email. Code requests (here and in
        `createSignup`) are limited to 5 an hour per address and 20 an hour
        per IP.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "202":
          description: A code is on its way, if the address has an account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/cli-tokens:
    post:
      operationId: createCliToken
      summary: Get a CLI token with an emailed code
      description: |
        Uses a code from `createSignup` or `createSignIn`, like
        `createSession`, but answers with a full-scope CLI token instead of
        setting a session cookie. This is how `mailgoose signup` finishes
        without a browser: a person still has to read the code from the email
        and type it in. On success a pending account becomes active. A wrong,
        expired, used or locked code gets the same `invalid_code` error; a
        code stops working after 5 wrong tries.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliTokenRequest"
      responses:
        "201":
          description: Signed in; the token is shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a web session with an emailed code
      description: |
        Uses a code from `createSignup` or `createSignIn`. On success a
        pending account becomes active, and the response sets an HttpOnly
        session cookie that lasts 30 days. A wrong, expired, used or locked
        code gets the same `invalid_code` error; a code stops working after 5
        wrong tries. After 10 wrong codes for one address within an hour,
        across all its codes and whether or not it has an account, even the
        right code gets 429 with `Retry-After` until the hour passes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "201":
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: "`mg_session`, HttpOnly, Secure, SameSite=Lax, 30 days."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteAllSessions
      summary: Sign out everywhere
      description: |
        Ends every web session of the signed-in person, this one included, and
        clears the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Who is signed in
      description: The account and person behind the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteCurrentSession
      summary: Sign out
      description: Ends this session and clears the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/domains:
    get:
      operationId: listDomains
      summary: List sending domains
      description: The account's sending domains, oldest first, each with its DNS records and the result of its last check.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          required: false
          description: Only the domain with this name, such as `example.com`.
          schema:
            type: string
            maxLength: 253
      responses:
        "200":
          description: A page of domains.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createDomain
      summary: Add a sending domain
      description: |
        Sets the domain up in Amazon SES, with DKIM signing and a MAIL FROM
        subdomain (`bounce.<domain>`), and answers with the DNS records to
        add: three DKIM CNAMEs, the MAIL FROM MX and SPF TXT, and a suggested
        DMARC TXT when the domain has no DMARC policy. Campaigns can only be
        sent from a verified domain. The domain is checked every 5 minutes for
        72 hours; `verifyDomain` checks it at once.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "201":
          description: The new domain, with the records to add.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/domains/{domain_id}:
    get:
      operationId: getDomain
      summary: Show a sending domain
      description: The domain, its DNS records and the result of its last check.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: The domain.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteDomain
      summary: Remove a sending domain
      description: |
        Removes the domain and its Amazon SES identity. Mail can no longer be
        sent from it. The DNS records can then be deleted.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "204":
          description: Removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/domains/{domain_id}/verify:
    post:
      operationId: verifyDomain
      summary: Check a sending domain now
      description: |
        Looks up each DNS record and reports it as `found`, `missing` or
        `wrong`, and asks Amazon SES whether it has verified the domain. The
        domain is verified when every required record is found and SES
        agrees. Checking a failed domain starts another 72 hours of background
        checks; if SES had given up on its DKIM records, the domain is set up
        again with new ones, and `records_changed` is true.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: The domain, as just checked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      description: The account's contacts, newest first. Filters combine; empty ones are ignored.
      tags: [contacts]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: email
          in: query
          required: false
          description: Only contacts whose address contains this, ignoring case.
          schema:
            type: string
            maxLength: 254
        - name: name
          in: query
          required: false
          description: Only contacts whose first, last or full name contains this, ignoring case.
          schema:
            type: string
            maxLength: 201
        - name: status
          in: query
          required: false
          description: Only contacts with this status.
          schema:
            $ref: "#/components/schemas/ContactStatus"
        - name: tag_id
          in: query
          required: false
          description: Only contacts with this tag.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of contacts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createContact
      summary: Add a contact
      description: |
        Adds one contact. The address is stored in lower case and must be new
        to the account. An address that was deleted after it unsubscribed,
        bounced or complained comes back with that status, whatever
        `status` asks for, so it isn't mailed again by mistake.
      tags: [contacts]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: The new contact.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/ContactConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/contacts/{contact_id}:
    get:
      operationId: getContact
      summary: Show a contact
      tags: [contacts]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The contact.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateContact
      summary: Change a contact
      description: |
        Changes only the fields sent; `null` removes a first or last name. A
        contact that unsubscribed, bounced or complained can't be subscribed
        again here (422 `contact_suppressed`): the person subscribes again
        through a signup form. Bounced and complained come only from Amazon
        SES.
      tags: [contacts]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: The contact as changed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContactConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteContact
      summary: Delete a contact
      description: |
        Deletes the contact and everything about it. If it had unsubscribed,
        bounced or complained, only a hash of its address stays, on the
        account's suppression list, so adding the address again keeps that
        status.
      tags: [contacts]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tags:
    get:
      operationId: listTags
      summary: List tags
      description: The account's tags by name, each with how many contacts have it.
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          required: false
          description: Only the tag with this name, ignoring case.
          schema:
            type: string
            maxLength: 50
      responses:
        "200":
          description: A page of tags.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createTag
      summary: Create a tag
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: The new tag.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/TagConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tags/{tag_id}:
    patch:
      operationId: renameTag
      summary: Rename a tag
      description: Contacts keep the tag under its new name.
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: The renamed tag.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TagConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: |
        Takes the tag off every contact and off the recipients of draft and
        scheduled campaigns, then deletes it. The response counts both.
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "200":
          description: What deleting the tag changed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tags/{tag_id}/contacts:
    post:
      operationId: tagContacts
      summary: Tag contacts
      description: |
        Puts the tag on the contacts listed in `contact_ids` (up to 1,000), or
        on every contact matching `filter`; an empty filter is every contact.
        Ids that aren't this account's are skipped.
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSelection"
      responses:
        "200":
          description: How many contacts were selected and how many gained the tag.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tags/{tag_id}/contacts/remove:
    post:
      operationId: untagContacts
      summary: Untag contacts
      description: Takes the tag off the selected contacts, chosen as in `tagContacts`.
      tags: [tags]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSelection"
      responses:
        "200":
          description: How many contacts were selected and how many lost the tag.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An account API key (`mg_live_…`, `mg_test_…`) or CLI token (`mg_cli_…`), sent as `Authorization: Bearer <key>`."
    sessionCookie:
      type: apiKey
      in: cookie
      name: mg_session
      description: The web session cookie that `createSession` sets.
  schemas:
    ContactStatus:
      type: string
      enum: [unconfirmed, subscribed, unsubscribed, bounced, complained]
      description: |
        Only `subscribed` contacts receive campaigns. `unconfirmed` is waiting
        for double opt-in or permission; `bounced` and `complained` come from
        Amazon SES.
    ContactSource:
      type: string
      enum: [form, import, api, manual]
      description: How the contact was added. `manual` is the web app.
    Contact:
      type: object
      required: [id, email, first_name, last_name, status, source, tags, created_at, updated_at, status_changed_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Stored in lower case.
          examples: [pat@example.com]
        first_name:
          type: [string, "null"]
        last_name:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ContactStatus"
        source:
          $ref: "#/components/schemas/ContactSource"
        tags:
          type: array
          description: The contact's tags, by name.
          items:
            $ref: "#/components/schemas/TagRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
    ContactList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: [string, "null"]
    CreateContactRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          examples: [pat@example.com]
        first_name:
          type: [string, "null"]
          maxLength: 100
        last_name:
          type: [string, "null"]
          maxLength: 100
        status:
          type: string
          enum: [subscribed, unconfirmed, unsubscribed]
          default: subscribed
          description: Use `unconfirmed` for someone who hasn't yet given permission to be mailed.
        source:
          type: string
          enum: [api, manual]
          default: api
          description: '`manual` is for contacts a person typed in; agents and scripts leave it out.'
    UpdateContactRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          maxLength: 254
        first_name:
          type: [string, "null"]
          maxLength: 100
        last_name:
          type: [string, "null"]
          maxLength: 100
        status:
          type: string
          enum: [subscribed, unconfirmed, unsubscribed]
    TagRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Tag:
      type: object
      required: [id, name, contact_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [newsletter]
        contact_count:
          type: integer
          description: How many contacts have the tag, whatever their status.
        created_at:
          type: string
          format: date-time
    TagList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        next_cursor:
          type: [string, "null"]
    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique in the account, ignoring case; one line, no commas.
    RenameTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    TagDeleted:
      type: object
      required: [contacts_untagged, campaigns_updated]
      properties:
        contacts_untagged:
          type: integer
          description: How many contacts had the tag.
        campaigns_updated:
          type: integer
          description: How many draft or scheduled campaigns had the tag among their recipients.
    ContactFilter:
      type: object
      additionalProperties: false
      description: Matches contacts as `listContacts` does; fields left out don't filter.
      properties:
        email:
          type: string
          maxLength: 254
        name:
          type: string
          maxLength: 201
        status:
          $ref: "#/components/schemas/ContactStatus"
        tag_id:
          type: string
          format: uuid
    ContactSelection:
      type: object
      additionalProperties: false
      description: Exactly one of `contact_ids` and `filter`.
      properties:
        contact_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
        filter:
          $ref: "#/components/schemas/ContactFilter"
    TagChange:
      type: object
      required: [matched, changed]
      properties:
        matched:
          type: integer
          description: How many of the account's contacts were selected.
        changed:
          type: integer
          description: How many gained or lost the tag; the others already had it or didn't.
    CreateDomainRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 253
          description: The domain to send from, such as `example.com` or `news.example.com`. Internationalized names are stored in their ASCII (punycode) form.
          examples: [example.com]
    DomainStatus:
      type: string
      enum: [pending, verified, failed]
      description: |
        `pending` until every required record is found and Amazon SES has
        verified the domain; `verified` after that; `failed` when 72 hours of
        checks passed without it.
    DnsRecord:
      type: object
      required: [purpose, type, name, value, priority, required, status, found, detail]
      properties:
        purpose:
          type: string
          enum: [dkim, mail_from_mx, mail_from_spf, dmarc]
        type:
          type: string
          enum: [CNAME, MX, TXT]
        name:
          type: string
          description: The full record name, such as `abc._domainkey.example.com`.
        value:
          type: string
        priority:
          type: [integer, "null"]
          description: The MX priority; null for other types.
        required:
          type: boolean
          description: Whether the domain needs this record to verify. The DMARC record is only suggested.
        status:
          type: string
          enum: [found, missing, wrong, unchecked]
          description: What the last check found; `unchecked` before the first check.
        found:
          type: array
          items:
            type: string
          description: The values the lookup returned, when there were any.
        detail:
          type: [string, "null"]
          description: What is wrong, or why the lookup failed.
    Domain:
      type: object
      required: [id, name, status, mail_from_domain, records, ses_status, created_at, last_checked_at, check_until, verified_at, failed_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [example.com]
        status:
          $ref: "#/components/schemas/DomainStatus"
        mail_from_domain:
          type: string
          description: The MAIL FROM subdomain, where bounces go.
          examples: [bounce.example.com]
        records:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        ses_status:
          type: [string, "null"]
          description: |
            Amazon SES's DKIM verification status at the last check: `pending`,
            `success`, `failed`, `temporary_failure`, `not_started`, or
            `not_found` and `unknown` when SES couldn't say. Null before the
            first check.
        created_at:
          type: string
          format: date-time
        last_checked_at:
          type: [string, "null"]
          format: date-time
        check_until:
          type: string
          format: date-time
          description: When background checks of a pending domain stop.
        verified_at:
          type: [string, "null"]
          format: date-time
        failed_at:
          type: [string, "null"]
          format: date-time
        records_changed:
          type: boolean
          description: Only in `verifyDomain` responses. True when the domain was set up again with new DKIM records, which replace the old ones in DNS.
    DomainList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        next_cursor:
          type: [string, "null"]
    CreateApiKeyRequest:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Claude on my laptop]
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
    AccountSettings:
      type: object
      required: [id, name, plan, from_name, from_email, postal_address, time_zone, missing_for_send, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
          enum: [free, paid]
        from_name:
          type: [string, "null"]
          description: The default From name for new campaigns.
          examples: [Pat's Bakery]
        from_email:
          type: [string, "null"]
          description: The default From address for new campaigns.
          examples: [news@patsbakery.example]
        postal_address:
          type: [string, "null"]
          description: The mailing address in every email's footer, one line per `\n`.
          examples: ["Pat's Bakery\n12 Main St\nSpringfield, IL 62701"]
        time_zone:
          type: string
          description: An IANA time zone name.
          examples: [America/Chicago]
        missing_for_send:
          type: array
          items:
            type: string
          description: Settings a campaign can't launch without, such as `postal_address`. Empty when none are missing.
        created_at:
          type: string
          format: date-time
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        from_name:
          type: [string, "null"]
          maxLength: 100
          description: One line, without quotes or angle brackets. `null` removes it.
        from_email:
          type: [string, "null"]
          format: email
          maxLength: 254
          description: "`null` removes it."
        postal_address:
          type: [string, "null"]
          maxLength: 500
          description: Up to 8 lines separated by `\n`; blank lines are dropped. `null` removes it.
        time_zone:
          type: string
          description: An IANA time zone name, such as `America/New_York` or `UTC`.
    ApiKeyScope:
      type: string
      enum: [full, draft]
      description: |
        `full` can do everything. `draft` can do everything except launch
        campaigns, change billing and manage keys.
    ApiKey:
      type: object
      required: [id, name, scope, hint, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        hint:
          type: string
          description: The secret's prefix and last four characters, to tell keys apart.
          examples: ["mg_live_…k3x9"]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When the key last made a request, to the minute; null if never.
    CreatedApiKey:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The key itself. It's shown only in this response.
          examples: ["mg_live_9w2k4m1qz7d8c3x5v6b0n1p2r3s4t5u6"]
    ApiKeyList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: [string, "null"]
    CreditSummary:
      type: object
      required: [balance, plan, next_grant_at]
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
          description: Credits available now, not counting any reserved for a send in progress.
        plan:
          type: string
          enum: [free, paid]
        next_grant_at:
          type: [string, "null"]
          format: date-time
          description: When the next 1,000 free credits arrive; null on the paid plan.
    CreditTransactionType:
      type: string
      enum: [grant, purchase, reserve, release, spend, fee, expiry]
      description: |
        `grant` is a free monthly grant and `purchase` a bought credit pack.
        `reserve` holds credits for a send and `release` gives back what it
        didn't use. `spend` is credits used directly, `fee` the monthly
        account fee and `expiry` credits that ran out.
    CreditTransaction:
      type: object
      required: [id, type, amount, expires_at, ref, created_at]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/CreditTransactionType"
        amount:
          type: integer
          format: int64
          description: Credits added (positive) or taken (negative).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When a grant's or purchase's credits expire; null for other types.
        ref:
          type: string
          description: What the transaction is for, such as a campaign id; empty when there's nothing to point to.
        created_at:
          type: string
          format: date-time
    CreditTransactionList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CreditTransaction"
        next_cursor:
          type: [string, "null"]
    CreateDeviceLoginRequest:
      type: object
      additionalProperties: false
      properties:
        client_name:
          type: string
          maxLength: 100
          description: Where the login comes from, such as the computer's name; shown on the approval page and used as the token's name.
          examples: [pat-laptop]
    DeviceLoginStart:
      type: object
      required: [device_code, user_code, verification_url, verification_url_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: The CLI's secret for polling. Don't show it.
        user_code:
          type: string
          description: The code the person confirms in the browser.
          examples: [BCDF-GHJK]
        verification_url:
          type: string
          format: uri
          description: Where the person approves the code.
        verification_url_complete:
          type: string
          format: uri
          description: "`verification_url` with the code filled in."
        expires_in:
          type: integer
          description: Seconds until the request expires.
          examples: [600]
        interval:
          type: integer
          description: Seconds to wait between polls.
          examples: [5]
    PollDeviceLoginRequest:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code:
          type: string
          maxLength: 100
    DeviceLoginPending:
      type: object
      required: [status, interval]
      properties:
        status:
          type: string
          enum: [pending]
        interval:
          type: integer
          description: Seconds to wait before polling again.
    DeviceLoginToken:
      type: object
      required: [token, key_id, account, user]
      properties:
        token:
          type: string
          description: A full-scope CLI token (`mg_cli_…`), shown only in this response.
        key_id:
          type: string
          format: uuid
        account:
          $ref: "#/components/schemas/Account"
        user:
          $ref: "#/components/schemas/User"
    DeviceLogin:
      type: object
      required: [user_code, client_name, created_at, expires_at]
      properties:
        user_code:
          type: string
          examples: [BCDF-GHJK]
        client_name:
          type: string
          description: Where the login comes from, as the CLI described it; may be empty.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Whoami:
      type: object
      required: [account, user, auth_method, scope, key_id]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The person behind the request; null for an API key whose maker was removed.
        auth_method:
          type: string
          enum: [session, api_key, cli_token]
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        key_id:
          type: [string, "null"]
          format: uuid
          description: The API key or CLI token used; null for a web session.
    SignupRequest:
      type: object
      required: [email, account_name, accepted_terms]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pat@example.com]
        account_name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Pat's Bakery]
        accepted_terms:
          type: boolean
          description: |
            Must be `true`: the person accepts the terms of service and the
            anti-spam policy. Anything else is a 422 `terms_not_accepted`.
    SignInRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pat@example.com]
    CodeSent:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [code_sent]
        message:
          type: string
          examples: ["Check your email for a six-digit code."]
    SessionRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: The six-digit code from the email.
          examples: ["042917"]
    CliTokenRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: The six-digit code from the email.
          examples: ["042917"]
        client_name:
          type: string
          maxLength: 100
          description: Names the token, such as the computer's name. Defaults to "CLI sign-up".
    Session:
      type: object
      required: [account, user, expires_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      required: [id, name, status, plan, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, active]
        plan:
          type: string
          enum: [free, paid]
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          examples: [v0.1.0]
        commit:
          type: string
          examples: [a1b2c3d]
        build_date:
          type: string
          description: When the server binary was built (RFC 3339), if known.
          examples: ["2026-11-18T12:00:00Z"]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, hint]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [database_unavailable]
            message:
              type: string
              description: Human-readable explanation.
            hint:
              type: string
              description: What to do about it. Empty when there's nothing to add.
              examples: ["Wait 20 seconds (see Retry-After) and try again."]
  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out for the first page.
      schema:
        type: string
    DomainId:
      name: domain_id
      in: path
      required: true
      description: The domain's `id`.
      schema:
        type: string
        format: uuid
    ContactId:
      name: contact_id
      in: path
      required: true
      description: The contact's `id`.
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      description: The tag's `id`.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry safe. A repeat with the same key and request within 24
        hours returns the stored response instead of running again; the same
        key with a different request is a 422 `idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    X-Request-Id:
      description: Identifies this request in our logs. Quote it when reporting a problem.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left before the limit applies.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    TagConflict:
      description: "`tag_exists`: the account already has a tag with that name, ignoring case."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContactConflict:
      description: "`contact_exists`: the account already has a contact with that address."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainConflict:
      description: |
        `domain_exists`: this account already has the domain.
        `domain_taken`: another mailgoose account has it.
        `domain_unavailable`: the domain is already set up in Amazon SES
        outside mailgoose's reach. Contact support for either of the last two.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: |
        The request is well formed but a field is wrong. `code` says which
        problem, such as `invalid_email`, `invalid_account_name`,
        `terms_not_accepted` or `invalid_code`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        `service_unavailable`: a dependency the endpoint needs (the database,
        or Amazon SES for domains) isn't configured or reachable. Try again
        later.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        `unauthenticated`: no API key or session cookie, or the session has
        ended. `invalid_api_key`: the key is wrong or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        `insufficient_scope`: a draft-scope key can't do this; use a full-scope
        key or the web app. `cross_origin_request`: a browser sent this from
        another site.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: there's no such thing in this account."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: |
        `cross_origin_request`: a browser sent this from another site. Only
        the web app's own origin may change things with a session cookie.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited (`rate_limited`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: |
        `idempotency_key_reused` (422): the key was used for a different
        request. `idempotency_request_in_progress` (409) is returned instead
        while the first request with the key is still running.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
