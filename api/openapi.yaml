              $ref: "#/components/headers/X-Request-Id"
            Content-Disposition:
              description: Names the file `skipped-rows.csv`.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                examples: ["row,source,email,reason,why\n3,,pat@,invalid_email,Not an email address.\n"]
        "400":
