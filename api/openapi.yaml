      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MailchimpUploadConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/bundles/{bundle_id}/confirm:
    post:
      operationId: confirmMailchimpBundle
      summary: Import an uploaded Mailchimp export
      description: |
        Starts the import: the contacts as a Mailchimp import (follow it with
        `getImport` and `import_id`), and the HTML emails, which this upload
        reports in `emails`. Both run in the background.

        `permission_confirmed` must be true: it says these people agreed to
        get your email. Mailchimp's subscribed contacts come in subscribed,
        with no confirmation email; pending ones come in unconfirmed,
        unsubscribed ones unsubscribed and cleaned ones bounced. `campaigns`
        is how many of the newest campaigns become emails (default 10, at
        most 100); every template does.

        Each audience also gets a signup form in its name, listed in
        `forms`, to replace its Mailchimp embedded form: email, first name
        and last name, double opt-in on, and the `audience: <name>` tag
        when there's more than one audience, plus the `form_tags` picked
        from its groups. These forms are drafts and take no signups until
        they're saved. Running the import again makes no second form for an
        audience. `form_tags` that aren't groups of the export's audiences
        are refused with 422 `unknown_form_tag`.

        Confirming again returns the upload as it is. `idempotency_key`
        (default: the hash of the contacts) makes a second upload of the same
        export return the import already made.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMailchimpBundleRequest"
      responses:
        "202":
          description: The upload, confirmed; its import and emails are queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpBundle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MailchimpRefused"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/connect:
    post:
      operationId: connectMailchimp
      summary: Start connecting a Mailchimp account
      description: |
        Returns a link to Mailchimp's page where the person lets mailgoose
        read their Mailchimp account. Open it in a browser signed in to this
        mailgoose account: Mailchimp sends the browser back to mailgoose,
        which connects the account only when that browser's session is this
        account's. The link works once, for 10 minutes; a new one replaces it.

        Mailchimp's access doesn't expire and isn't limited, so mailgoose
        keeps it for at most 24 hours, only reads with it, and forgets it
        once the import is done or on `disconnectMailchimp`.

        Answers 503 `mailchimp_not_configured` where connecting isn't set up;
        uploading Mailchimp's export (`createMailchimpBundle`) still works.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The link to open.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpConnect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/connection:
    get:
      operationId: getMailchimpConnection
      summary: Get the connected Mailchimp account
      description: |
        Whether a Mailchimp account is connected, which one, and when
        mailgoose forgets it. The access itself is never returned.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: "The connection, or `connected: false`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/disconnect:
    post:
      operationId: disconnectMailchimp
      summary: Forget the connected Mailchimp account
      description: |
        Deletes mailgoose's access to the connected Mailchimp account now,
        and any unused connect link. Answers `connected: false` even when
        nothing was connected. To remove mailgoose from the Mailchimp account
        as well, do that in Mailchimp's own settings.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: Nothing is connected now.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/audiences:
    get:
      operationId: listMailchimpAudiences
      summary: List the connected Mailchimp account's audiences
      description: |
        The audiences of the Mailchimp account connected with
        `connectMailchimp`, by name, with Mailchimp's own counts and whether
        each asks for double opt-in. Pick their ids for
        `createMailchimpFetch`.

        Answers 409 `mailchimp_not_connected` when no account is connected,
        and 409 `mailchimp_access_revoked` (and forgets the connection) when
        Mailchimp no longer takes mailgoose's access.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The audiences.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpAudienceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MailchimpNotConnected"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/MailchimpUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/fetch:
    post:
      operationId: createMailchimpFetch
      summary: Fetch audiences and emails from the connected Mailchimp account
      description: |
        Starts reading the connected Mailchimp account: every member of the
        chosen audiences, whatever their status, with their merge fields,
        groups, tags, opt-in and signup times and IPs and GDPR permissions;
        each chosen saved segment as a tag `segment: <name>` on its members
        as they are now (a snapshot that doesn't update); and the content of
        the newest sent campaigns. It runs in the background: poll
        `getMailchimpFetch` until `status` is `done`, when `bundle` is the
        result, previewed and confirmed like an uploaded export
        (`confirmMailchimpBundle`). Confirming it forgets the connection.

        Mailchimp's API doesn't give a template's HTML, so templates come
        over only by uploading the account export.

        An account runs one fetch at a time (409 `fetch_in_progress`), and a
        finished one counts toward the 3 unconfirmed bundles an account
        keeps.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailchimpFetchRequest"
      responses:
        "202":
          description: The fetch, queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpFetch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/MailchimpFetchConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/mailchimp/fetch/{fetch_id}:
    get:
      operationId: getMailchimpFetch
      summary: Get a fetch from Mailchimp
      description: |
        How a fetch is going: the step, the audience being read and the
        members read so far. Once `done`, `bundle` is the fetched bundle
        with its preview; once `failed`, `error` says why. Finished fetches
        are kept for 7 days.
      tags: [imports]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FetchId"
      responses:
        "200":
          description: The fetch.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailchimpFetch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
