      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmailSummary"
        next_cursor:
          type: [string, "null"]
    CreateEmailRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/EmailKind"
          default: blocks
        document:
          $ref: "#/components/schemas/EmailDocument"
    UpdateEmailRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/EmailSettingsUpdate"
    ReplaceEmailDocumentRequest:
      type: object
      additionalProperties: false
      required: [version, document]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        document:
          $ref: "#/components/schemas/EmailDocument"
    ImportEmailHtmlRequest:
      type: object
      additionalProperties: false
      required: [version, html]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        html:
          type: string
          maxLength: 512000
          description: The whole markup. Over 102 KB is refused as `too_large`.
    ImportEmailHtmlResult:
      type: object
      additionalProperties: false
      required: [email, warnings]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        warnings:
          type: array
          description: CSS that some clients drop; the email still sends.
          items:
            $ref: "#/components/schemas/HtmlIssue"
    HtmlIssue:
      type: object
      additionalProperties: false
      required: [line, code, message]
      properties:
        line:
          type: integer
          minimum: 1
          description: The line it's on, counting from 1.
        code:
          type: string
          enum: [malformed_markup, script, form, iframe, embedded_object, external_stylesheet,
            event_handler, javascript_url, data_url, redirect, missing_unsubscribe, merge_tag_link,
            too_large, mailchimp_merge_tag, unsupported_css]
        message:
          type: string
    EmailCheck:
      type: object
      additionalProperties: false
      required: [ok, errors, warnings]
      properties:
        ok:
          type: boolean
          description: True when there are no errors, so the email can be sent.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/EmailCheckIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/EmailCheckIssue"
    EmailCheckIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing_subject, missing_from, unverified_from, unverified_reply_to, missing_postal_address,
            empty_email, merge_tag, missing_unsubscribe, broken_link, too_large, invalid_html, unsafe_link,
            insecure_link, link_unreachable, link_not_checked, link_safety_not_checked, missing_alt,
            near_size_limit, unsupported_css, shared_domain]
        message:
          type: string
        path:
          type: string
          description: The block field or setting it's about, such as `blocks[2].alt` or `settings.subject`.
        line:
          type: integer
          minimum: 1
          description: The line of an html email's markup it's on.
        url:
          type: string
          description: The link it's about.
    DuplicateEmailRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    AddEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version, block]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        block:
          type: object
          description: |
            A Block with at least its `type`. `id` and fields with defaults
            may be left out. A footer can't be added; every blocks email
            already has one.
          required: [type]
          properties:
            type:
              type: string
        after:
          $ref: "#/components/schemas/BlockId"
        index:
          type: integer
          minimum: 0
        parent_id:
          $ref: "#/components/schemas/BlockId"
        column:
          type: integer
          minimum: 0
          maximum: 3
          description: Which column of `parent_id`, 0 first (left).
    UpdateEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        fields:
          type: object
          minProperties: 1
          description: The block's fields to set, by name, as in its Block schema. Not `id` or `type`.
    MoveEmailBlockRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: The new place, as in BlockPlace.
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you read.
        after:
          $ref: "#/components/schemas/BlockId"
        index:
          type: integer
          minimum: 0
        parent_id:
          $ref: "#/components/schemas/BlockId"
        column:
          type: integer
          minimum: 0
          maximum: 3
          description: Which column of `parent_id`, 0 first (left).
    EmailBlockEntry:
      type: object
      additionalProperties: false
      required: [block, path, parent_id, column, index]
      properties:
        block:
          $ref: "#/components/schemas/Block"
        path:
          type: string
          description: The block's place, as in an `invalid_document` error, such as `blocks[2].columns[0].blocks[1]`.
        parent_id:
          type: [string, "null"]
          description: The columns block holding it; null at the top level.
        column:
          type: [integer, "null"]
          description: Which column of `parent_id` holds it; null at the top level.
        index:
          type: integer
          description: Its place in its list, 0 first.
    EmailBlockList:
      type: object
      additionalProperties: false
      required: [email_id, version, data]
      properties:
        email_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmailBlockEntry"
    EmailBlockChange:
      type: object
      additionalProperties: false
      required: [block, email]
      properties:
        block:
          $ref: "#/components/schemas/EmailBlockEntry"
        email:
          $ref: "#/components/schemas/Email"
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, hint]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [database_unavailable]
            message:
              type: string
              description: Human-readable explanation.
            hint:
              type: string
              description: What to do about it. Empty when there's nothing to add.
              examples: ["Wait 20 seconds (see Retry-After) and try again."]
            details:
              type: object
              description: |
                Extra facts some errors carry; absent otherwise. A
                `contact_limit` has `limit` and `count`, an
                `invalid_document` has `path`, and a `version_conflict` has
                `current_version`.
              additionalProperties: true
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: Why, for the admin log (and, for a pause, the account). At most 500 characters.
    GrantTesterRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        until:
          type: string
          format: date-time
          description: When it stops sending; at most 366 days away. Left out, it's 30 days from now.
        credits:
          type: integer
          minimum: 1
          maximum: 10000
          description: Its sends for its life, counted from when it first became a tester. Left out, it's 500.
        reason:
          type: string
          description: Why, for the admin log. At most 500 characters.
    GrantCreditsRequest:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        reason:
          type: string
    AdminRates:
      type: object
      description: Copies sent, and the recipients who hard bounced or complained.
      required: [sent, hard_bounces, complaints]
      properties:
        sent:
          type: integer
        hard_bounces:
          type: integer
        complaints:
          type: integer
    AdminAccountSummary:
      type: object
      required: [id, name, status, plan, owner_email, sending_paused_at, sending_paused_reason,
        suspended_at, suspended_reason, suspended_by, review, review_flags, review_at, sending_mode,
        test_addresses_confirmed, test_addresses_pending, tester_until, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        plan:
          type: string
        owner_email:
          type: [string, "null"]
        sending_paused_at:
          type: [string, "null"]
          format: date-time
        sending_paused_reason:
          type: [string, "null"]
        suspended_at:
          type: [string, "null"]
          format: date-time
          description: When the account was suspended (MG-65); null when it isn't.
        suspended_reason:
          type: [string, "null"]
        suspended_by:
          type: [string, "null"]
          description: The admin's address, `mailgoosed`, or `automatic`.
        review:
          type: [string, "null"]
          enum: [waiting, approved, rejected, null]
          description: The sign-up review (MG-66); null for an account that never needed one.
        review_flags:
          type: array
          items:
            type: string
            enum: [disposable_domain, ip_burst, suspended_ip, suspended_domain]
          description: |
            What looked risky at sign-up: a disposable address, more than 3
            accounts from its IP in 24 hours, or an IP or company domain
            shared with a suspended account. Empty when nothing did.
        review_at:
          type: [string, "null"]
          format: date-time
          description: When the account started waiting for review.
        sending_mode:
          $ref: "#/components/schemas/SendingMode"
        test_addresses_confirmed:
          type: integer
          description: Test addresses whose link was used (MG-80).
        test_addresses_pending:
          type: integer
          description: Test addresses whose link hasn't been used yet.
        tester_until:
          type: [string, "null"]
          format: date-time
          description: |
            When a tester account's period ends or ended (MG-86); null when
            it isn't a tester. Once it has passed the account sends nothing,
            including batches already on the send queue (MG-107), until an
            admin extends or revokes it.
        created_at:
          type: string
          format: date-time
    AdminAccountList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountSummary"
        next_cursor:
          type: "null"
    AdminDeliverabilityRates:
      type: object
      description: |
        Campaign copies sent in the window, and the recipients whose hard
        bounce or complaint was reported in it, with the rates as
        percentages (rounded to 4 places; null when nothing was sent in the
        window).
      required: [sent, hard_bounces, complaints, hard_bounce_percent, complaint_percent]
      properties:
        sent:
          type: integer
        hard_bounces:
          type: integer
        complaints:
          type: integer
        hard_bounce_percent:
          type: [number, "null"]
        complaint_percent:
          type: [number, "null"]
    AdminAccountDeliverability:
      type: object
      required: [account_id, account_name, owner_email, sending_mode, tester_until, sending_paused_at, suspended_at,
        throttled_until, last_24_hours, last_7_days, over_warning]
      properties:
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        owner_email:
          type: [string, "null"]
        sending_mode:
          $ref: "#/components/schemas/SendingMode"
        tester_until:
          type: [string, "null"]
          format: date-time
          description: When its tester account (MG-86) ends, or ended; null when it isn't a tester account.
        sending_paused_at:
          type: [string, "null"]
          format: date-time
          description: When its sending was paused; null when it isn't.
        suspended_at:
          type: [string, "null"]
          format: date-time
          description: When it was suspended; null when it isn't.
        throttled_until:
          type: [string, "null"]
          format: date-time
          description: When its early-warning throttle lifts; null when it isn't throttled.
        last_24_hours:
          $ref: "#/components/schemas/AdminDeliverabilityRates"
        last_7_days:
          $ref: "#/components/schemas/AdminDeliverabilityRates"
        over_warning:
          type: boolean
          description: |
            Whether its last 7 days are over the early warning, as the daily
            digest judges them: see `early_warning`.
    AdminEarlyWarning:
      type: object
      description: |
        The early warning: over `complaint_percent` complaints (and at least
        `min_complaints` of them) or over `hard_bounce_percent` hard
        bounces, on `min_copies` or more copies.
      required: [complaint_percent, hard_bounce_percent, min_complaints, min_copies]
      properties:
        complaint_percent:
          type: number
        hard_bounce_percent:
          type: number
        min_complaints:
          type: integer
        min_copies:
          type: integer
    AdminSendThroughput:
      type: object
      description: |
        How fast campaign copies went out over the last 24 hours, across
        every account (MG-91), from the send batches that sent at least one
        copy and finished in the window. SES mailbox simulator copies
        count: they're real SES calls. Rates are rounded to 2 places, and
        null when no time was spent sending.
      required: [since, batches, copies, busy_seconds, copies_per_second, batch_seconds, per_batch_copies_per_second,
        send_rate_per_second]
      properties:
        since:
          type: string
          format: date-time
          description: The window's start; it runs to now.
        batches:
          type: integer
        copies:
          type: integer
          description: Copies those batches sent.
        busy_seconds:
          type: number
          description: |
            Seconds when at least one batch was sending (overlapping
            batches merged). Time between batches isn't counted.
        copies_per_second:
          type: [number, "null"]
          description: |
            `copies` over `busy_seconds`: the platform's rate while it was
            sending, to set against `send_rate_per_second`.
        batch_seconds:
          type: number
          description: The batches' send times added up.
        per_batch_copies_per_second:
          type: [number, "null"]
          description: |
            `copies` over `batch_seconds`: how fast one batch sends. It
            matches `copies_per_second` when batches don't overlap (one
            worker); batches that ran at once shared the rate.
        send_rate_per_second:
          type: integer
          description: The configured `SEND_RATE_PER_SECOND`, the most copies a second across every worker.
    AdminDeliverabilityReport:
      type: object
      required: [data, next_cursor, total, early_warning, send_throughput]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountDeliverability"
        next_cursor:
          type: "null"
        total:
          type: integer
          description: Every account in the report, including those over `limit`.
        early_warning:
          $ref: "#/components/schemas/AdminEarlyWarning"
        send_throughput:
          $ref: "#/components/schemas/AdminSendThroughput"
    AdminTableSize:
      type: object
      required: [table, row_estimate, total_bytes, total_bytes_7_days_ago, change_7_days_bytes]
      properties:
        table:
          type: string
        row_estimate:
          type: [integer, "null"]
          format: int64
          description: |
            The planner's estimate of its rows (`pg_class.reltuples`), not an
            exact count; null when the table has never been analysed.
        total_bytes:
          type: integer
          format: int64
          description: Its size with indexes and TOAST (`pg_total_relation_size`).
        total_bytes_7_days_ago:
          type: [integer, "null"]
          format: int64
          description: Its size as recorded on `compared_with_day`; null with no record from that day.
        change_7_days_bytes:
          type: [integer, "null"]
          format: int64
          description: |
            `total_bytes` less `total_bytes_7_days_ago` (negative when it
            shrank); null with no record from `compared_with_day`.
    AdminStorageReport:
      type: object
      required: [data, next_cursor, total, total_bytes, compared_with_day]
      properties:
        data:
          type: array
          description: "`campaign_recipients` and `send_events` first, then the largest other tables."
          items:
            $ref: "#/components/schemas/AdminTableSize"
        next_cursor:
          type: "null"
        total:
          type: integer
          description: Every table in the database, including those over `limit`.
        total_bytes:
          type: integer
          format: int64
          description: Every table's `total_bytes` added up.
        compared_with_day:
          type: string
          format: date
          description: The UTC day, 7 days before today, whose recorded sizes the change is against.
    AdminHeldImport:
      type: object
      required: [id, file_name, total_rows, hold_reason, status, list_source, list_source_detail, checks, created_at, mailchimp]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: [string, "null"]
        total_rows:
          type: integer
        hold_reason:
          type: string
        list_source:
          type: [string, "null"]
        list_source_detail:
          type: [string, "null"]
        checks:
          type: object
          required: [invalid_rows, role_addresses, disposable_addresses, shared_addresses, shared_account_id]
          description: |
            What the import's checks found. `shared_addresses` is how many of
            its distinct addresses other accounts imported, and
            `shared_account_id` the account with most of them; no addresses
            are shown.
          properties:
            invalid_rows:
              type: integer
            role_addresses:
              type: integer
            disposable_addresses:
              type: integer
            shared_addresses:
              type: integer
            shared_account_id:
              type: [string, "null"]
              format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        mailchimp:
          description: |
            For a Mailchimp import, what its preview showed, to judge it by;
            null for any other import, and for a Mailchimp import confirmed
            before these were kept. They add no hold of their own.
          oneOf:
            - $ref: "#/components/schemas/AdminMailchimpSignals"
            - type: "null"
    AdminMailchimpSignals:
      type: object
      required: [source, file_name, audiences, by_status, members, cleaned_share, unsubscribed_share, with_optin_time, optin_share, newest_optin]
      properties:
        source:
          type: string
          enum: [file, oauth]
          description: "`file` for an uploaded export, `oauth` for one fetched from a connected Mailchimp account."
        file_name:
          type: [string, "null"]
        audiences:
          type: array
          items:
            type: object
            required: [name, members]
            properties:
              name:
                type: string
              members:
                type: integer
        by_status:
          $ref: "#/components/schemas/MailchimpStatusCounts"
        members:
          type: integer
          description: Every audience's members, of every status.
        cleaned_share:
          type: number
          description: Cleaned members as a share of `members`, from 0 to 1.
        unsubscribed_share:
          type: number
          description: Unsubscribed members as a share of `members`, from 0 to 1.
        with_optin_time:
          type: integer
          description: Subscribed members with a Mailchimp opt-in time.
        optin_share:
          type: number
          description: "`with_optin_time` as a share of the subscribed members, from 0 to 1."
        newest_optin:
          type: [string, "null"]
          format: date-time
    AdminLiveCampaign:
      type: object
      required: [id, name, status, send_at, recipients, rates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        send_at:
          type: [string, "null"]
          format: date-time
        recipients:
          type: integer
        rates:
          $ref: "#/components/schemas/AdminRates"
    AdminAccount:
      allOf:
        - $ref: "#/components/schemas/AdminAccountSummary"
        - type: object
          required: [daily_send_limit, send_limit, throttles, contacts, credit_balance, last_30_days, held_imports, live_campaigns, terms_version,
            terms_accepted_at, tester]
          properties:
            tester:
              oneOf:
                - $ref: "#/components/schemas/TesterStatus"
                - type: "null"
              description: Its tester state (MG-86); null when it isn't a tester account.
            terms_version:
              type: [string, "null"]
              description: The latest version of the terms the account accepted; null if it never accepted one.
            terms_accepted_at:
              type: [string, "null"]
              format: date-time
              description: When it accepted that version.
            daily_send_limit:
              type: [integer, "null"]
              description: The account's own daily limit; null follows the schedule.
            send_limit:
              $ref: "#/components/schemas/SendLimit"
            throttles:
              type: array
              description: Its early-warning throttles in the last 30 days, newest first.
              items:
                $ref: "#/components/schemas/AdminThrottle"
            contacts:
              type: integer
            credit_balance:
              type: integer
              format: int64
            last_30_days:
              $ref: "#/components/schemas/AdminRates"
            held_imports:
              type: array
              items:
                $ref: "#/components/schemas/AdminHeldImport"
            live_campaigns:
              type: array
              items:
                $ref: "#/components/schemas/AdminLiveCampaign"
    AdminThrottle:
      type: object
      required: [id, campaign_id, reason, created_at, until]
      properties:
        id:
          type: integer
          format: int64
        campaign_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: When it lifts, or lifted.
    CreditGrant:
      type: object
      required: [account_id, amount, expires_at, credit_balance]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        credit_balance:
          type: integer
          format: int64
    ApprovedImport:
      type: object
      required: [id, account_id, contacts_released]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        contacts_released:
          type: integer
          format: int64
          description: How many of its contacts can now be mailed.
    AdminAction:
      type: object
      required: [id, actor, action, account_id, target_id, reason, details, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
          description: The admin's address, `mailgoosed` (the server's command line) or `automatic`.
        action:
          type: string
          enum: [grant_admin, revoke_admin, pause, unpause, auto_pause, stop_campaign, approve_import, grant_credits, throttle,
            suspend, unsuspend, auto_suspend, approve_signup, reject_signup, allow_full_sending, set_test_mode, grant_tester,
            revoke_tester]
        account_id:
          type: [string, "null"]
          format: uuid
        target_id:
          type: [string, "null"]
          description: The campaign, import or user acted on.
        reason:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AdminActionList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAction"
        next_cursor:
          type: [string, "null"]
  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out for the first page.
      schema:
        type: string
    DomainId:
      name: domain_id
      in: path
      required: true
      description: The domain's `id`.
      schema:
        type: string
        format: uuid
    ContactId:
      name: contact_id
      in: path
      required: true
      description: The contact's `id`.
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      description: The tag's `id`.
      schema:
        type: string
        format: uuid
    AccountId:
      name: account_id
      in: path
      required: true
      description: The account's `id`.
      schema:
        type: string
        format: uuid
    TestAddressId:
      name: test_address_id
      in: path
      required: true
      description: The test address's `id`.
      schema:
        type: string
        format: uuid
    SenderAddressId:
      name: sender_address_id
      in: path
      required: true
      description: The sender address's `id`.
      schema:
        type: string
        format: uuid
    ImportId:
      name: import_id
      in: path
      required: true
      description: The import's `id`.
      schema:
        type: string
        format: uuid
    FetchId:
      name: fetch_id
      in: path
      required: true
      description: The fetch's `id`, from `createMailchimpFetch`.
      schema:
        type: string
        format: uuid
    BundleId:
      name: bundle_id
      in: path
      required: true
      description: The uploaded export's `id`, from `createMailchimpBundle`.
      schema:
        type: string
        format: uuid
    BlockId:
      name: block_id
      in: path
      required: true
      description: The block's `id`.
      schema:
        $ref: "#/components/schemas/BlockId"
    FormId:
      name: form_id
      in: path
      required: true
      description: The form's `id`.
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaign_id
      in: path
      required: true
      description: The campaign's `id`.
      schema:
        type: string
        format: uuid
    EmailId:
      name: email_id
      in: path
      required: true
      description: The email's `id`.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry safe. A repeat with the same key and request within 24
        hours returns the stored response instead of running again; the same
        key with a different request is a 422 `idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    X-Request-Id:
      description: Identifies this request in our logs. Quote it when reporting a problem.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left before the limit applies.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    AdminAccount:
      description: The account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAccount"
    InvalidAdminRequest:
      description: |
        `invalid_admin_request`: `details.field` is `reason` (missing, or over
        500 characters), `amount` (not 1 to 1,000,000), or for a tester
        grant `until` (passed, or over 366 days away) or `credits` (not 1 to
        10,000).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailchimpNotConnected:
      description: |
        `mailchimp_not_connected`: no Mailchimp account is connected, or the
        connection has expired; connect one with `connectMailchimp`.
        `mailchimp_access_revoked`: Mailchimp no longer takes mailgoose's
        access, so the connection was forgotten; connect again.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailchimpFetchConflict:
      description: |
        `mailchimp_not_connected` or `mailchimp_access_revoked`, as for
        `listMailchimpAudiences`. `fetch_in_progress`: the account's earlier
        fetch hasn't finished. `too_many_uploads`: the account already has 3
        unconfirmed bundles; confirm or delete one.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailchimpUnavailable:
      description: |
        `mailchimp_unavailable`: Mailchimp's API didn't answer, or refused
        the request. Try again in a few minutes.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailchimpUploadConflict:
      description: |
        `too_many_uploads`: the account already has 3 unconfirmed uploads;
        confirm or delete one (`deleteMailchimpBundle`), or wait for one to
        expire. `upload_in_progress`: another upload for the account is still
        arriving. `upload_confirmed`: a confirmed upload can't be deleted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlanConflict:
      description: |
        `plan_required`: credit packs are for the paid plan; start it with
        createPlanCheckout. `already_subscribed`: the account is already on
        the paid plan. `not_subscribed`: the account has no subscription to
        manage.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnknownPack:
      description: |
        `unknown_pack`: there's no pack by that name; `details.packs` lists
        the packs with their credits and prices.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentProviderError:
      description: "`payment_provider_error`: Stripe couldn't make the Checkout page; try again shortly."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TagConflict:
      description: "`tag_exists`: the account already has a tag with that name, ignoring case."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContactLimit:
      description: |
        `contact_limit`: a free account, or a tester account (MG-86) on any
        plan, holds at most 500 counted contacts (unconfirmed and
        subscribed). `details.limit` is the limit and `details.count` the
        counted contacts now. Other paid accounts have no cap.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ImportRefused:
      description: |
        The file can't be imported, and nothing was queued. `code` says why:
        `no_rows`, `no_email_column` (name the column in `columns.email`),
        `invalid_mapping` (a named column isn't in the header),
        `invalid_encoding` (not UTF-8), `invalid_csv` (a quote never closes),
        `too_many_rows` (over 100,000), `file_too_large`, `tag_not_found`,
        `too_many_tags`, `list_source_required` (say where the list came
        from), `list_source_detail_required` (describe an `other` source) or
        `invalid_list_source`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailchimpRefused:
      description: |
        The export can't be read or imported, and nothing was kept or
        queued. `code` says why: `not_zip_or_csv`, `bad_zip`, `unsafe_path`,
        `too_large` (over 1 GB unpacked), `too_many_members` (over the
        import's limit), `too_many_columns`, `no_email_column`,
        `unknown_status`, `nothing_to_read`, `file_required`,
        `invalid_audience_name`, `invalid_group_column`,
        `too_many_group_columns`, `permission_required`, `too_many_tags`,
        `invalid_campaigns`, `invalid_idempotency_key`,
        `idempotency_key_reused` or `upload_used` (the file was already
        imported and removed).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestTooLarge:
      description: "`request_too_large`: the request body is over the operation's limit."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ImportConflict:
      description: "`import_not_waiting`: only an import that's waiting for the paid plan can be cancelled."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContactConflict:
      description: "`contact_exists`: the account already has a contact with that address."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainConflict:
      description: |
        `domain_exists`: this account already has the domain.
        `domain_taken`: another mailgoose account has it.
        `domain_unavailable`: the domain is already set up in Amazon SES
        outside mailgoose's reach. Contact support for either of the last two.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: |
        The request is well formed but a field is wrong. `code` says which
        problem, such as `invalid_email`, `invalid_account_name`,
        `account_name_not_allowed`, `terms_not_accepted` or `invalid_code`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidEmail:
      description: |
        `invalid_document`: the document breaks the schema; `message` names
        the place, such as `blocks[2].href`, and `details.path` holds it.
        `invalid_name` (empty or over 200 characters), `invalid_kind` (not
        blocks or html) or `kind_mismatch` (a document of the other kind).
        `invalid_html`: an html document's markup has errors, listed in
        `details.issues` as importEmailHtml describes; empty markup is
        allowed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidHtml:
      description: |
        `invalid_html`: the markup has errors and nothing changed.
        `details.issues` lists each, with its `line`, `code` and `message`;
        `message` names the first. `kind_mismatch`: the email is a blocks
        email, which has no markup.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidImage:
      description: |
        `invalid_image`: the file is empty, over 5 MB, or isn't a JPEG,
        PNG, GIF or WebP; `details.detected` says what it looks like when
        it's another kind of file.
        `too_many_images`: the account already keeps 1,000 images.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidForm:
      description: |
        `invalid_form`: a part of the form breaks a rule; `details.field`
        names it (such as `redirect_url` or `fields[1].name`).
        `unknown_tag`: a tag id isn't one of the account's tags.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCampaign:
      description: |
        `invalid_campaign`: a part breaks a rule; `details.field` names it
        (`name`, `email_id`, `recipients` or `send_at`). `unknown_email` and
        `unknown_tag`: an id isn't one of the account's.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SuspensionConflict:
      description: |
        `account_suspended`: the account is suspended already.
        `account_not_suspended`: the account isn't suspended.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TesterConflict:
      description: |
        `signup_not_approved`: the account's sign-up review (MG-66) waits
        or was rejected, so it can't be a tester. `account_suspended`: the
        account is suspended. `not_tester`: revoking an account that isn't
        a tester account.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SendingModeConflict:
      description: |
        `sending_mode_unchanged`: the account is in that sending mode
        already.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestAddressConflict:
      description: |
        `test_address_exists`: the account has that address already.
        `test_address_limit`: the account has 5 test addresses; remove one
        first. `test_address_confirmed`: the address is confirmed, so
        there's no link to resend.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidTestAddress:
      description: |
        `invalid_email`: that isn't an email address.
        `test_address_is_owner`: the owner's own sign-in address is always
        allowed, so it needs no slot.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestAddressEmailFailed:
      description: |
        `test_address_email_failed`: the confirm email couldn't be sent. The
        address is kept, pending; resend its link in a minute.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestAddressLinkExpired:
      description: |
        `test_address_link_expired`: the link is older than 7 days. Resend
        it from the web app or with `mailgoose test-addresses resend`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SenderAddressConflict:
      description: |
        `sender_address_exists`: the account has that address already.
        `sender_address_limit`: the account has 10 sender addresses; remove
        one first. `sender_address_confirmed`: the address is confirmed, so
        there's no link to resend.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSenderAddress:
      description: |
        `invalid_email`: that isn't an email address.
        `sender_address_is_owner`: the owner's own sign-in address always
        counts, so it needs no slot.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SenderAddressEmailFailed:
      description: |
        `sender_address_email_failed`: the confirm email couldn't be sent.
        The address is kept, pending; resend its link in a minute.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SenderAddressLinkExpired:
      description: |
        `sender_address_link_expired`: the link is older than 7 days.
        Resend it from the web app or with `mailgoose sender-addresses
        resend`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignupReviewConflict:
      description: |
        `signup_not_waiting`: the account isn't waiting for its sign-up
        review (or, to approve, its review neither waits nor was rejected).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CampaignConflict:
      description: |
        `campaign_locked`: only drafts can be changed, tested, launched or
        deleted; `details.status` is the campaign's status.
        `version_conflict`: the campaign changed since the version given;
        `details.current_version` is its version now.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestNotSendable:
      description: |
        `not_ready`: something stops the email being sent;
        `details.problems` lists each with its `code` (`no_email`,
        `missing_from`, `unverified_from`, `unverified_reply_to`,
        `missing_postal_address`, `missing_subject`, `empty_email`,
        `merge_tag`, `invalid_html`,
        `unsafe_link` with the link in `url`), `message` and `hint`.
        `unverified_from` also has `from_email`, the From, and
        `shared_sending`, true when shared sending is on: the owner's own
        sign-in address then sends as it is, and so does a sender address
        added with `addSenderAddress` once its link is opened.
        `invalid_test`: `to` has an address that isn't one, or more than 5.
        `test_recipient_not_allowed`: an address in `to` isn't the owner's
        or on a verified sending domain; `details.address` names it.
        `test_recipient_suppressed`: an address in `to` unsubscribed,
        bounced or complained (the owner's own address is never refused);
        `details.address` names it. `test_mode`: the account is in test
        mode (MG-80) and an address in `to` is neither the owner's nor a
        confirmed test address, whatever its domain; `details.address`
        names it. `tester_limit`: a tester account (MG-86) has ended, or the
        test needs more tester credits than are left (simulator addresses
        need none); `details` has `needed`, `credits`, `used`, `left`,
        `until` and `ended`. A tester account may also test to SES mailbox
        simulator addresses (`*@simulator.amazonses.com`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchConfirmation:
      description: |
        `confirmation_required`: nothing was launched. `details.summary`
        (`campaign_id`, `name`, `subject`, `from`, `reply_to`,
        `shared_domain`, `sender`, `default_from`, `recipient_count`,
        `send_at`, `credits`, `balance`, `warnings`) is what the person
        confirms. `shared_domain` is true when the campaign goes from
        mailgoose's shared sending domain (MG-85) because its From isn't on
        a verified domain: `from` is then the account's shared address, and
        `sender` the verified address it was set to go from (null
        otherwise). `default_from` is true when neither the email nor the
        account sets a From, so it goes as the owner's sign-in address
        (`sender`) by default (MG-108), with replies to it. Show it, with a
        nudge to add the sender's domain; `details.code` the code that launches it
        once they say yes, and `details.expires_at` when the code stops
        working. `campaign_locked`: the campaign isn't a draft and wasn't
        launched; `details.status` is its status.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchRefused:
      description: |
        `not_ready`: the campaign can't launch; `details.problems` lists
        each reason with its `code`, `message` and `hint`: Prepare's
        (`no_email`, `missing_from`, `unverified_from` (with `from_email`
        and `shared_sending`, as for a test),
        `unverified_reply_to` (on the shared sending domain, the Reply-To
        must be a verified sender or on a verified domain),
        `missing_postal_address`, `missing_subject`, `empty_email`,
        `merge_tag`), `check_failed` (an email check error), `unsafe_link`
        (a link on Google Web Risk's malware, phishing or unwanted software
        lists, named in `url`; it also pauses the account's sending),
        `untested` (no test since the last change), `send_at_passed`,
        `account_paused`, `account_suspended`, `account_in_review` (a new account waiting for its sign-up
        review; not for an account in test mode), `signup_rejected` (the account's sign-up review was
        rejected and its suspension lifted without approving it; not for an account in test mode), `test_mode` (the account is in test mode and the
        campaign reaches anyone but its confirmed test addresses and its owner; `details.recipients`
        and `details.not_test_addresses`), `new_terms_not_accepted` (the terms changed and
        the account hasn't accepted the new version; `details.current_version`
        and `details.accepted_version`, then `acceptTerms`),
        `subscription_past_due` (sending is paused until the paid plan's
        payment goes through; listed after `account_paused` when another
        pause took over the past-due one, which then stays after the
        payment until it's lifted), `no_recipients`, `credits_short` with `details.needed`,
        `details.balance` and `details.short`, and `tester_limit` (a tester account, MG-86, that has
        ended, or whose campaign needs more tester credits than are left; `details.needed`,
        `details.credits`, `details.used`, `details.left`, `details.until` and `details.ended`). `invalid_confirmation`: the
        code can't be used; `details.reason` is `no_code`, `expired`,
        `wrong`, `too_many_attempts`, `changed`, or `audience_grew` (the
        campaign now reaches more than a tenth more contacts than the
        summary counted, with `details.summarized_count` and
        `details.recipient_count`). Ask for a new summary.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestLimited:
      description: |
        `test_limit`: the account has sent 50 test emails in the last 24
        hours; Retry-After says when enough have aged out. `rate_limited`:
        the API's request limit.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TestSendFailed:
      description: |
        `test_send_failed`: a copy was refused, by the send guard or the mail
        provider, or the provider didn't answer. Copies before it went;
        copies after it weren't tried. `details.address` is the copy's
        address, and `details.counted` is true when it still counts toward
        the day's tests because it may have gone (no answer); a refused
        copy, and the copies after it, don't count.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnrenderableEmail:
      description: |
        `invalid_merge_tags`: a merge tag can't be filled or a link is
        unsafe; `details.problems` lists each with its `path` (such as
        `blocks[2].text`, or `html`) and `message`. `empty_email`: an html
        email with no markup yet. `invalid_html`: the html email's markup
        fails the import check (possible only for markup saved before a
        check was added); `details.problems` lists each with its `line`,
        `code` and `message`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidBlockChange:
      description: |
        `kind_mismatch`: the email is html, which has no blocks.
        `invalid_document`: the block or the fields break the schema, or the
        change would (such as columns inside a column); `details.path` names
        the place. `footer_locked`: the change would remove or move the
        footer, add a second one, or put a block after it.
        `invalid_position`: the place can't be used, such as `after` a block
        that isn't there or `column` without `parent_id`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BlockNotFound:
      description: |
        `not_found`: there's no such email in this account.
        `block_not_found`: the email has no block with that id.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmailVersionConflict:
      description: |
        `version_conflict`: the email was saved since the version given was
        read, and nothing changed. `details.current_version` is its version
        now; read it again and redo the change.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        `service_unavailable`: a dependency the endpoint needs (the database,
        or Amazon SES for domains) isn't configured or reachable. Try again
        later.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        `unauthenticated`: no API key or session cookie, or the session has
        ended. `invalid_api_key`: the key is wrong or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        `insufficient_scope`: a draft-scope key can't do this; use a full-scope
        key or the web app. `cross_origin_request`: a browser sent this from
        another site. `admin_only`: only a signed-in mailgoose admin can do
        this. `account_suspended`: the account is suspended; see the API's
        description for what it can still do.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: there's no such thing in this account."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: |
        `cross_origin_request`: a browser sent this from another site. Only
        the web app's own origin may change things with a session cookie.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited (`rate_limited`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: |
        `idempotency_key_reused` (422): the key was used for a different
        request. `idempotency_request_in_progress` (409) is returned instead
        while the first request with the key is still running.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
