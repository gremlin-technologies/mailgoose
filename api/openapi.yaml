openapi: 3.1.0
info:
  title: mailgoose API
  version: 0.1.0
  description: |
    One REST API shared by the web app, the CLI and AI agents. Every endpoint
    here gets a matching `mailgoose` CLI command.

    Conventions every endpoint follows:

    - Errors use the `Error` schema: `{"error": {"code", "message", "hint"}}`,
      with a stable `code` to branch on.
    - Lists take the `Limit` and `Cursor` parameters and return
      `{"data": [...], "next_cursor": "..." | null}`.
    - Every response carries `X-Request-Id`.
    - POST, PUT, PATCH and DELETE accept an `Idempotency-Key` header; a repeat
      within 24 hours returns the stored response with
      `Idempotent-Replayed: true`.
    - Requests are rate limited per API key; responses carry `RateLimit-Limit`
      and `RateLimit-Remaining`, and a 429 carries `Retry-After`.

    The web app signs in with emailed codes and a session cookie. Browser
    requests that change something and carry no `Authorization` header must
    come from the web app's own origin (a 403 `cross_origin_request`
    otherwise). Everything else authenticates with an API key or CLI token:
    API keys sent as bearer tokens, which the CLI reads from `MAILGOOSE_API_KEY`
    or its config file. Operations marked `x-required-scope: full` refuse
    draft-scope keys with a 403 `insufficient_scope`.

    A suspended account (`account.suspension` on the session) has no API
    keys or CLI logins; its owner can still sign in to the web app. Its
    session may then read (GET) for 30 days after the suspension, to export
    contacts and campaigns, and sign out; everything else is a 403
    `account_suspended`, as is every read after the 30 days except the
    session, `getAccount` and `whoami`.
servers:
  - url: https://api.staging.mailgoose.app
    description: Staging
  - url: http://localhost:8080
    description: Local
security:
  - apiKey: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      description: |
        Says the process is up. The load balancer polls it, so it does not
        check the database. The CLI's `mailgoose status` calls it.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Like /healthz, and also checks that the database answers.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API and its database are up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not configured or not reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/account:
    get:
      operationId: getAccount
      summary: Show account settings
      description: |
        The account's name, plan, default From name and address, postal
        address and time zone. `missing_for_send` lists the settings a
        campaign can't launch without, `send_limit` its daily send limit now
        and why it's lower than usual, and `terms` the version of the terms
        the account accepted against the current one.
      tags: [account]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateAccount
      summary: Change account settings
      description: |
        Changes only the fields sent. Send `null` to remove the default From
        name, From address or postal address; the name and time zone can't be
        removed. The postal address goes in the footer of every email, as
        anti-spam law requires, and campaigns can't launch without it. The
        From address is checked for format here; a campaign can only send
        from a domain verified for the account.
      tags: [account]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: The account after the change.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteAccount
      summary: Delete the account
      description: |
        Deletes the account and everything in it, now: contacts, emails,
        sending domains (and their Amazon SES identities), API keys, CLI
        logins and web sessions, and the person's sign-in. Only the billing
        records the law requires stay, under a closed account with its name
        and settings cleared. A paid plan's subscription is cancelled first,
        at once, with no refund for the rest of the period; if Stripe can't
        be reached the account isn't deleted (502), so try again. The
        address can sign up again afterwards. `confirm` must be the
        account's name exactly, as `getAccount` shows it. This can't be
        undone.
      tags: [account]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: confirm
          in: query
          description: >-
            The account's name, exactly. Required; a request without it is a
            400. (It's checked after the key's scope, so a draft key always
            gets a 403.)
          schema:
            type: string
            maxLength: 200
      responses:
        "204":
          description: Deleted. A web session's cookie is cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/account/terms:
    post:
      operationId: acceptTerms
      summary: Accept the current terms
      description: |
        Accepts the current version of mailgoose's terms of service,
        anti-spam policy, privacy policy and data processing agreement for
        the account. `version` must be the current version, as
        `getAccount` shows it in `terms.current_version`; anything else is a
        422 `terms_version_not_current`, so a person only accepts the version
        they read. When the terms change, campaigns can't launch until the
        new version is accepted (`new_terms_not_accepted`). Each acceptance
        is kept, with its time and whether it came from the web app, the CLI
        or an API key. Accepting the version already accepted changes
        nothing.
      tags: [account]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTermsRequest"
      responses:
        "200":
          description: The account, with the terms it has now accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: The account's active API keys, oldest first. Secrets are never shown again.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of keys.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Makes a key and answers with its secret, which is shown only this
        once; store it somewhere safe. Keys made in production start
        `mg_live_`, and keys made anywhere else start `mg_test_`. A `draft` key
        can do everything except launch campaigns, change billing and manage
        keys. An account can have 50 active keys.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The new key, with its secret.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: The key stops working on its next request. This can't be undone.
      tags: [api-keys]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: key_id
          in: path
          required: true
          description: The key's `id`.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/test-addresses:
    get:
      operationId: listTestAddresses
      summary: List test addresses
      description: |
        The account's test addresses (MG-80), oldest first: at most 5,
        pending ones included, so there's no next page. While the account
        is in test mode (`sending_mode` on the account) it can send only to
        its `confirmed` test addresses and its owner's own sign-in address,
        which is always allowed and isn't listed.
      tags: [test-addresses]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The account's test addresses.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAddressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: addTestAddress
      summary: Add a test address
      description: |
        Adds a test address (MG-80) and emails it a link to confirm it; it
        counts once the link is used, within 7 days. An account keeps up to
        5, pending ones included; remove one to free its slot. Addresses
        are compared ignoring case. The owner's own sign-in address is
        always allowed and can't be added.

        Adding one emails someone, so it needs a full-scope key or a
        sign-in (403 `insufficient_scope` for a draft-scope key). An
        account sends at most 10 confirm emails in any 24 hours, adds and
        resends alike, and removing an address gives none back (429
        `test_address_rate_limited` with `Retry-After`).
      tags: [test-addresses]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTestAddressRequest"
      responses:
        "201":
          description: The new test address, pending until its link is used.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/TestAddressConflict"
        "422":
          $ref: "#/components/responses/InvalidTestAddress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/TestAddressEmailFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/test-addresses/confirm:
    post:
      operationId: confirmTestAddress
      summary: Confirm a test address
      description: |
        Uses the token from a test address's confirm link (MG-80); the web
        app's page at the link calls it. No credentials are needed: the
        token is the proof. Using it again changes nothing and answers the
        same. A token that isn't one is a 400 `invalid_token`; one for no
        address (removed, or replaced by a newer link) a 404
        `test_address_link_not_found`; one older than 7 days a 410
        `test_address_link_expired`.
      tags: [test-addresses]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTestAddressRequest"
      responses:
        "200":
          description: Confirmed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedTestAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/TestAddressLinkExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/test-addresses/{test_address_id}:
    delete:
      operationId: removeTestAddress
      summary: Remove a test address
      description: The address frees its slot, its link stops working, and test mode no longer sends to it.
      tags: [test-addresses]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TestAddressId"
      responses:
        "204":
          description: Removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/test-addresses/{test_address_id}/resend:
    post:
      operationId: resendTestAddress
      summary: Resend a test address's confirm link
      description: |
        Emails a pending test address a new confirm link, good for 7 days;
        the old link stops working. At most once a minute per address (429
        `test_address_resend_too_soon` with `Retry-After`), and it counts
        toward the account's 10 confirm emails in any 24 hours (429
        `test_address_rate_limited`). A confirmed address answers 409
        `test_address_confirmed`. Needs a full-scope key or a sign-in.
      tags: [test-addresses]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TestAddressId"
      responses:
        "200":
          description: The test address, with the new link's times.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TestAddressConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/TestAddressEmailFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sender-addresses:
    get:
      operationId: listSenderAddresses
      summary: List sender addresses
      description: |
        The account's sender addresses (MG-85), oldest first: at most 10,
        pending ones included, so there's no next page. A custom domain is
        optional: when the server has shared sending on (`shared_address`
        on the account isn't null), an email whose From isn't on a verified
        domain of the account still sends if its From is a `confirmed`
        sender address or the owner's own sign-in address, which always
        counts and isn't listed. It then goes from the account's
        `shared_address`, with replies to that address. A verified domain
        of your own is still better for deliverability and trust.
      tags: [sender-addresses]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The account's sender addresses.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderAddressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: addSenderAddress
      summary: Add a sender address
      description: |
        Adds a sender address (MG-85) and emails it a link to confirm the
        account may send as it; it counts once the link is used, within 7
        days. An account keeps up to 10, pending ones included; remove one
        to free its slot. Addresses are compared ignoring case. The owner's
        own sign-in address always counts and can't be added.

        Adding one emails someone, so it needs a full-scope key or a
        sign-in (403 `insufficient_scope` for a draft-scope key). An
        account sends at most 10 sender address confirm emails in any 24
        hours, adds and resends alike, and removing an address gives none
        back (429 `sender_address_rate_limited` with `Retry-After`).
      tags: [sender-addresses]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSenderAddressRequest"
      responses:
        "201":
          description: The new sender address, pending until its link is used.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/SenderAddressConflict"
        "422":
          $ref: "#/components/responses/InvalidSenderAddress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/SenderAddressEmailFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sender-addresses/confirm:
    post:
      operationId: confirmSenderAddress
      summary: Confirm a sender address
      description: |
        Uses the token from a sender address's confirm link (MG-85); the
        web app's page at the link calls it. No credentials are needed: the
        token is the proof. Using it again changes nothing and answers the
        same. A token that isn't one is a 400 `invalid_token`; one for no
        address (removed, or replaced by a newer link) a 404
        `sender_address_link_not_found`; one older than 7 days a 410
        `sender_address_link_expired`.
      tags: [sender-addresses]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSenderAddressRequest"
      responses:
        "200":
          description: Confirmed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedSenderAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/SenderAddressLinkExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sender-addresses/{sender_address_id}:
    delete:
      operationId: removeSenderAddress
      summary: Remove a sender address
      description: |
        The address frees its slot, its link stops working, and the account
        can no longer send as it from the shared domain. Campaigns already
        sending from it stop going out.
      tags: [sender-addresses]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SenderAddressId"
      responses:
        "204":
          description: Removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sender-addresses/{sender_address_id}/resend:
    post:
      operationId: resendSenderAddress
      summary: Resend a sender address's confirm link
      description: |
        Emails a pending sender address a new confirm link, good for 7
        days; the old link stops working. At most once a minute per address
        (429 `sender_address_resend_too_soon` with `Retry-After`), and it
        counts toward the account's 10 sender address confirm emails in any
        24 hours (429 `sender_address_rate_limited`). A confirmed address
        answers 409 `sender_address_confirmed`. Needs a full-scope key or a
        sign-in.
      tags: [sender-addresses]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SenderAddressId"
      responses:
        "200":
          description: The sender address, with the new link's times.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SenderAddressConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/SenderAddressEmailFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credits:
    get:
      operationId: getCredits
      summary: Show the credit balance
      description: |
        The account's balance, its plan, and when its next free grant comes.
        One credit sends one email to one recipient. Free accounts get 1,000
        credits when they activate and on each monthly anniversary of that,
        and unused free credits expire when the next grant arrives.
      tags: [credits]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The balance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credits/checkout:
    post:
      operationId: createCreditCheckout
      summary: Start buying a credit pack
      description: |
        Makes a Stripe Checkout page for a credit pack and returns its URL;
        the person pays there, in a browser (BIL-3, BIL-6). Nothing is
        charged until they do. Once Stripe says the payment went through,
        the pack's credits are added, lasting 24 months. Packs are for the
        paid plan (createPlanCheckout); a free account gets a 409
        `plan_required`. Sales tax is worked out at checkout and Stripe
        emails the receipt. The page expires after 24 hours. Packs: `10k`
        ($20), `50k` ($75), `200k` ($240) and `1m` ($900), unless the
        server's configured otherwise.
      tags: [credits]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditCheckoutRequest"
      responses:
        "201":
          description: The Checkout page to pay at.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCheckout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanConflict"
        "422":
          $ref: "#/components/responses/UnknownPack"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plan:
    get:
      operationId: getPlan
      summary: Show the account's plan
      description: |
        The account's plan (BIL-4): free, or paid by a Stripe subscription
        at $5 a month or $50 a year for each plan unit. One unit covers the
        first 2,500 counted contacts (subscribed and unconfirmed), and each
        further 10,000, or part of one, is another. `units_needed` is what
        the contacts make now; the subscription moves to it at its next
        renewal.
      tags: [plan]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The plan.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plan/checkout:
    post:
      operationId: createPlanCheckout
      summary: Start the paid plan
      description: |
        Makes a Stripe Checkout page that starts the paid plan's card
        subscription, billed monthly ($5 a unit) or yearly ($50 a unit), and
        returns its URL; the person pays there, in a browser. Once Stripe
        confirms it, the account is paid: up to its plan units' contacts, no
        more free monthly credits, and credit packs to buy (BIL-5). Sales
        tax is worked out at checkout. The page expires after 24 hours. An
        account already on the paid plan gets a 409 `already_subscribed`;
        createPlanPortal changes or cancels it.
      tags: [plan]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCheckoutRequest"
      responses:
        "201":
          description: The Checkout page to pay at.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCheckout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plan/portal:
    post:
      operationId: createPlanPortal
      summary: Manage the paid plan
      description: |
        Makes a Stripe customer portal page for the account's subscription
        and returns its URL: change the card, see invoices, or cancel. A
        cancelled plan runs to the end of the period it's paid for, then the
        account is free again; bought credits stay. An account that never
        subscribed gets a 409 `not_subscribed`.
      tags: [plan]
      x-required-scope: full
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "201":
          description: The portal page.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPortal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credits/transactions:
    get:
      operationId: listCreditTransactions
      summary: List credit transactions
      description: |
        Every change to the balance, newest first: grants, purchases,
        reservations for a send and their release, spends, fees and expiries.
        Amounts are signed, so the balance is their sum.
      tags: [credits]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of transactions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditTransactionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins:
    post:
      operationId: createDeviceLogin
      summary: Start a CLI login
      description: |
        Starts the device login that `mailgoose login` uses. Show the person
        `user_code` and `verification_url`; they sign in to the web app and
        approve the code there. Meanwhile poll `pollDeviceLogin` with
        `device_code` every `interval` seconds. The request expires after
        `expires_in` seconds (10 minutes).
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceLoginRequest"
      responses:
        "201":
          description: The request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect a CLI login token
      description: |
        Polled by `mailgoose login`. Answers 202 while the request awaits
        approval, and 200 with a full-scope CLI token (`mg_cli_…`) once it's
        approved; the token is given out only once. A denied request is a 403
        `device_login_denied`; an expired, unknown or already collected one
        is a 410 `device_login_expired`. Polling faster than `interval` is a
        429 `slow_down`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollDeviceLoginRequest"
      responses:
        "200":
          description: Approved. The token is shown only in this response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginToken"
        "202":
          description: Not approved yet; poll again after `interval` seconds.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginPending"
        "403":
          description: The person denied the request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The request expired, doesn't exist or was already collected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}:
    get:
      operationId: getDeviceLogin
      summary: Show a CLI login awaiting approval
      description: |
        For the approval page: the request under this code, if it's still
        awaiting approval. Needs a signed-in web session; API keys and CLI
        tokens get a 401.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: The request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}/approve:
    post:
      operationId: approveDeviceLogin
      summary: Approve a CLI login
      description: |
        Lets the CLI that started this request sign in as the signed-in
        person, with a full-scope token. Needs a signed-in web session.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "204":
          description: Approved; the CLI collects its token on its next poll.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/device-logins/{user_code}/deny:
    post:
      operationId: denyDeviceLogin
      summary: Deny a CLI login
      description: The CLI that started this request stops waiting and signs nothing in. Needs a signed-in web session.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code `mailgoose login` printed, such as `BCDF-GHJK`. Case, spaces and the dash don't matter.
          schema:
            type: string
            maxLength: 20
      responses:
        "204":
          description: Denied.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/cli-tokens/current:
    delete:
      operationId: revokeCurrentCliToken
      summary: Sign out the CLI
      description: |
        Revokes the CLI token this request is made with, for `mailgoose
        logout`. Only CLI tokens (`mg_cli_…`); revoke API keys with
        `revokeApiKey`.
      tags: [auth]
      security:
        - apiKey: []
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: The request wasn't made with a CLI token (code `not_a_cli_token`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/whoami:
    get:
      operationId: getWhoami
      summary: Who is calling
      description: The account, the person and the kind of credential behind this request.
      tags: [auth]
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The caller.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/signup:
    post:
      operationId: createSignup
      summary: Sign up
      description: |
        Creates a pending account on the free plan and emails a six-digit code
        to the address; using the code with `createSession` activates the
        account. The answer is the same whether or not the address already
        has an account: an address with an active account gets a sign-in code
        instead, and no new account is made. A repeat within a minute sends no
        new email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: A code is on its way, if the address can receive one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sign-in:
    post:
      operationId: createSignIn
      summary: Email a sign-in code
      description: |
        Emails a six-digit code to an address with an account; use it with
        `createSession`. The answer is the same whether or not the address has
        an account, and an address with no account gets no email. An account
        that hasn't finished signing up gets its sign-up code instead. A repeat
        within a minute sends no new email. Code requests (here and in
        `createSignup`) are limited to 5 an hour per address and 20 an hour
        per IP.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "202":
          description: A code is on its way, if the address has an account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/cli-tokens:
    post:
      operationId: createCliToken
      summary: Get a CLI token with an emailed code
      description: |
        Uses a code from `createSignup` or `createSignIn`, like
        `createSession`, but answers with a full-scope CLI token instead of
        setting a session cookie. This is how `mailgoose signup` finishes
        without a browser: a person still has to read the code from the email
        and type it in. On success a pending account becomes active. A wrong,
        expired, used or locked code gets the same `invalid_code` error; a
        code stops working after 5 wrong tries. A suspended account gets
        `account_suspended` (403): it has no CLI logins.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliTokenRequest"
      responses:
        "201":
          description: Signed in; the token is shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a web session with an emailed code
      description: |
        Uses a code from `createSignup` or `createSignIn`. On success a
        pending account becomes active, and the response sets an HttpOnly
        session cookie that lasts 30 days. A wrong, expired, used or locked
        code gets the same `invalid_code` error; a code stops working after 5
        wrong tries. After 10 wrong codes for one address within an hour,
        across all its codes and whether or not it has an account, even the
        right code gets 429 with `Retry-After` until the hour passes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "201":
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: "`mg_session`, HttpOnly, Secure, SameSite=Lax, 30 days."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteAllSessions
      summary: Sign out everywhere
      description: |
        Ends every web session of the signed-in person, this one included, and
        clears the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Who is signed in
      description: The account and person behind the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteCurrentSession
      summary: Sign out
      description: Ends this session and clears the session cookie.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/domains:
    get:
      operationId: listDomains
      summary: List sending domains
      description: The account's sending domains, oldest first, each with its DNS records and the result of its last check.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          required: false
          description: Only the domain with this name, such as `example.com`.
          schema:
            type: string
            maxLength: 253
      responses:
        "200":
          description: A page of domains.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createDomain
      summary: Add a sending domain
      description: |
        Sets the domain up in Amazon SES, with DKIM signing and a MAIL FROM
        subdomain (`bounce.<domain>`), and answers with the DNS records to
        add: three DKIM CNAMEs, the MAIL FROM MX and SPF TXT, and a suggested
        DMARC TXT when the domain has no DMARC policy. Campaigns can only be
        sent from a verified domain. The domain is checked every 5 minutes for
        72 hours; `verifyDomain` checks it at once.
      tags: [domains]
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "201":
          description: The new domain, with the records to add.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
