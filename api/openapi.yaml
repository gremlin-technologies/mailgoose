openapi: 3.1.0
info:
  title: mailgoose API
  version: 0.1.0
  description: |
    One REST API shared by the web app, the CLI and AI agents. Every endpoint
    here gets a matching `mailgoose` CLI command.

    Conventions every endpoint follows:

    - Errors use the `Error` schema: `{"error": {"code", "message", "hint"}}`,
      with a stable `code` to branch on.
    - Lists take the `Limit` and `Cursor` parameters and return
      `{"data": [...], "next_cursor": "..." | null}`.
    - Every response carries `X-Request-Id`.
    - POST, PUT, PATCH and DELETE accept an `Idempotency-Key` header; a repeat
      within 24 hours returns the stored response with
      `Idempotent-Replayed: true`.
    - Requests are rate limited per API key; responses carry `RateLimit-Limit`
      and `RateLimit-Remaining`, and a 429 carries `Retry-After`.

    Sign-up and code sign-in exist; the web app uses a session cookie. API
    authentication is a placeholder:
    API keys sent as bearer tokens, which the CLI reads from `MAILGOOSE_API_KEY`
    or its config file. The real scheme (key format, scopes such as
    draft-only) comes with the auth ticket.
servers:
  - url: https://api.staging.mailgoose.app
    description: Staging
  - url: http://localhost:8080
    description: Local
security:
  - apiKey: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      description: |
        Says the process is up. The load balancer polls it, so it does not
        check the database. The CLI's `mailgoose status` calls it.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Like /healthz, and also checks that the database answers.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API and its database are up.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not configured or not reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/signup:
    post:
      operationId: createSignup
      summary: Sign up
      description: |
        Creates a pending account on the free plan and emails a six-digit code
        to the address; using the code with `createSession` activates the
        account. The answer is the same whether or not the address already
        has an account: an address with an active account gets a sign-in code
        instead, and no new account is made. A repeat within a minute sends no
        new email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: A code is on its way, if the address can receive one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a web session with an emailed code
      description: |
        Uses a code from `createSignup` (and, later, sign-in). On success a
        pending account becomes active, and the response sets an HttpOnly
        session cookie that lasts 30 days. A wrong, expired, used or locked
        code gets the same `invalid_code` error; a code stops working after 5
        wrong tries.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "201":
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: "`mg_session`, HttpOnly, Secure, SameSite=Lax, 30 days."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Placeholder. An account API key, sent as `Authorization: Bearer <key>`."
  schemas:
    SignupRequest:
      type: object
      required: [email, account_name, accepted_terms]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pat@example.com]
        account_name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Pat's Bakery]
        accepted_terms:
          type: boolean
          description: |
            Must be `true`: the person accepts the terms of service and the
            anti-spam policy. Anything else is a 422 `terms_not_accepted`.
    CodeSent:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [code_sent]
        message:
          type: string
          examples: ["Check your email for a six-digit code."]
    SessionRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: The six-digit code from the email.
          examples: ["042917"]
    Session:
      type: object
      required: [account, user, expires_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      required: [id, name, status, plan, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, active]
        plan:
          type: string
          enum: [free, paid]
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          examples: [v0.1.0]
        commit:
          type: string
          examples: [a1b2c3d]
        build_date:
          type: string
          description: When the server binary was built (RFC 3339), if known.
          examples: ["2026-11-18T12:00:00Z"]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, hint]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [database_unavailable]
            message:
              type: string
              description: Human-readable explanation.
            hint:
              type: string
              description: What to do about it. Empty when there's nothing to add.
              examples: ["Wait 20 seconds (see Retry-After) and try again."]
  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out for the first page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry safe. A repeat with the same key and request within 24
        hours returns the stored response instead of running again; the same
        key with a different request is a 422 `idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    X-Request-Id:
      description: Identifies this request in our logs. Quote it when reporting a problem.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left before the limit applies.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    ValidationFailed:
      description: |
        The request is well formed but a field is wrong. `code` says which
        problem, such as `invalid_email`, `invalid_account_name`,
        `terms_not_accepted` or `invalid_code`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        `service_unavailable`: a dependency the endpoint needs (the database)
        isn't configured or reachable. Try again later.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited (`rate_limited`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: |
        `idempotency_key_reused` (422): the key was used for a different
        request. `idempotency_request_in_progress` (409) is returned instead
        while the first request with the key is still running.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
