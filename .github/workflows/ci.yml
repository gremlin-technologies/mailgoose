name: CI

# Build, test, lint and build the image. Never deploys and holds no AWS
# credentials: GitHub OIDC deploys are off until the AWS project allows the
# OIDC provider (docs/decisions.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailgoose
          POSTGRES_PASSWORD: mailgoose
          POSTGRES_DB: mailgoose_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailgoose -d mailgoose_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: go test
        env:
          MAILGOOSE_TEST_DATABASE_URL: postgres://mailgoose:mailgoose@localhost:5432/mailgoose_test?sslmode=disable
        # The api package's database-backed tests take 7 to 9 minutes under
        # -race on a hosted runner, near go test's default 10-minute limit.
        run: go test -race -count=1 -timeout 20m ./...

  e2e:
    name: End-to-end
    # The CLI and the web app, each from sign-up to a sent campaign, against
    # the local stack: the API and the worker from scripts/dev.sh, with the
    # fake sender writing mail to .local/mail. Nothing leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailgoose
          POSTGRES_PASSWORD: mailgoose
          POSTGRES_DB: mailgoose
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailgoose -d mailgoose"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://mailgoose:mailgoose@localhost:5432/mailgoose?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the web app
        run: make web
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start the local stack
        run: |
          ./scripts/dev.sh > stack.log 2>&1 &
          for _ in $(seq 120); do
            curl -sf http://localhost:8080/readyz && exit 0
            sleep 1
          done
          cat stack.log
          exit 1
      - name: CLI end to end
        run: time ./scripts/e2e-cli.sh
      - name: Web end to end
        working-directory: web
        run: time npx playwright test
      - name: Stack log
        if: failure()
        run: tail -n 200 stack.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  image:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
