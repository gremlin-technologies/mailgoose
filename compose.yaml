# Local development: Postgres, the API and the worker.
#   docker compose up --build
# The API is on http://localhost:8080 and runs migrations when it starts.
# The worker gets no queue URLs locally, so it idles until stopped.

services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: mailgoose
      POSTGRES_PASSWORD: mailgoose # local only
      POSTGRES_DB: mailgoose
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailgoose -d mailgoose"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: ["serve"]
    read_only: true # matches readonlyRootFilesystem on ECS
    environment:
      APP_ENV: local
      PORT: "8080"
      DATABASE_URL: postgres://mailgoose:mailgoose@postgres:5432/mailgoose?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    read_only: true
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://mailgoose:mailgoose@postgres:5432/mailgoose?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
